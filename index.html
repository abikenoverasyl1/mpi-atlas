const OPMAP=Object.fromEntries(OPS.map(o=>[o.id,o]));

function plan(op,np,root){
  const s0={v:Array(np).fill(null),dim:Array(np).fill(false)};
  const P=[];const abs=r=>(r+root)%np;
  const add=(msgs,apply)=>P.push({msgs,apply});
  const reduceTree=(rt,base)=>{
    const acc=base.slice();
    for(let mask=1;mask<np;mask<<=1){
      const msgs=[],upd=[];
      for(let r=0;r<np;r++){
        if((r&(2*mask-1))===mask){const f=(r+rt)%np,t=(r-mask+rt)%np;msgs.push({f,t,l:String(acc[f])});upd.push([t,acc[t]+acc[f],f])}
      }
      upd.forEach(([t,v])=>acc[t]=v);
      if(msgs.length) add(msgs,s=>upd.forEach(([t,v,f])=>{s.v[t]=v;s.dim[f]=true}));
    }
    return acc[rt];
  };
  const bcastTree=(rt,val)=>{
    for(let mask=1;mask<np;mask<<=1){
      const msgs=[];
      for(let r=0;r<mask;r++) if(r+mask<np) msgs.push({f:(r+rt)%np,t:(r+mask+rt)%np,l:String(val)});
      add(msgs,s=>msgs.forEach(m=>{s.v[m.t]=val;s.dim[m.t]=false}));
    }
  };
  switch(op){
    case 'sendrecv':
      s0.v[0]=[5,1,4];
      add([{f:0,t:1,l:'[5,1,4]'}],s=>{s.v[1]=[10,2,8]});
      add([{f:1,t:0,l:'[10,2,8]'}],s=>{s.v[0]=[10,2,8]});
      break;
    case 'ring':{
      s0.v[0]=0;let tok=0;
      for(let k=0;k<np;k++){const f=k,t=(k+1)%np,val=tok,nt=t===0?tok:tok+t;add([{f,t,l:String(val)}],s=>{s.v[t]=nt});tok=nt}
      break;}
    case 'bcast': s0.v[root]=42; bcastTree(root,42); break;
    case 'scatter':{
      s0.v[root]=VALS.slice(0,np);const msgs=[];
      for(let i=0;i<np;i++) if(i!==root) msgs.push({f:root,t:i,l:String(VALS[i])});
      add(msgs,s=>{for(let i=0;i<np;i++) s.v[i]=VALS[i]});break;}
    case 'gather':{
      for(let i=0;i<np;i++) s0.v[i]=VALS[i];const msgs=[];
      for(let i=0;i<np;i++) if(i!==root) msgs.push({f:i,t:root,l:String(VALS[i])});
      add(msgs,s=>{s.v[root]=VALS.slice(0,np)});break;}
    case 'reduce':
      for(let i=0;i<np;i++) s0.v[i]=VALS[i];
      reduceTree(root,VALS.slice(0,np));break;
    case 'allreduce':{
      for(let i=0;i<np;i++) s0.v[i]=VALS[i];
      const tot=reduceTree(0,VALS.slice(0,np));bcastTree(0,tot);break;}
    case 'allgather':{
      for(let i=0;i<np;i++){s0.v[i]=Array(np).fill(null);s0.v[i][i]=VALS[i]}
      for(let k=0;k<np-1;k++){
        const msgs=[];
        for(let i=0;i<np;i++){const b=(i-k+np)%np;msgs.push({f:i,t:(i+1)%np,l:String(VALS[b]),b})}
        add(msgs,s=>msgs.forEach(m=>{s.v[m.t][m.b]=VALS[m.b]}));
      }
      break;}
    case 'barrier':{
      s0.v.fill('@run');const m1=[],m2=[];
      for(let i=0;i<np;i++) if(i!==root){m1.push({f:i,t:root,l:'ready'});m2.push({f:root,t:i,l:'go'})}
      add(m1,s=>s.v.fill('@wait'));add(m2,s=>s.v.fill('@go'));break;}
  }
  const clone=s=>({v:s.v.map(x=>Array.isArray(x)?x.slice():x),dim:s.dim.slice()});
  const states=[s0];
  P.forEach(p=>{const s=clone(states[states.length-1]);p.apply(s);states.push(s)});
  return {phases:P,states};
}
const fmt=v=>v==null?'—':Array.isArray(v)?'['+v.map(x=>x==null?'·':x).join(',')+']':(typeof v==='string'&&v[0]==='@')?T('v_'+v.slice(1)):String(v);
const NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

class Sim{
  constructor(svg,o){Object.assign(this,{W:640,H:600,R:200,off:56,speed:1,cur:0,tok:0,onUpdate:()=>{}},o);this.svg=svg;svg.setAttribute('viewBox',`0 0 ${this.W} ${this.H}`)}
  load(op,np,root){this.cancel();Object.assign(this,{op,np,root:Math.min(root,np-1)});const p=plan(op,np,this.root);this.phases=p.phases;this.states=p.states;this.cur=0;this.draw();this.render();this.emit()}
  draw(){
    const {W,H,R,np}=this,cx=W/2,cy=H/2;this.svg.innerHTML='';
    this.pos=[...Array(np)].map((_,i)=>{const a=-Math.PI/2+2*Math.PI*i/np;return{x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),ux:Math.cos(a),uy:Math.sin(a)}});
    mk('circle',{class:'orbit',cx,cy,r:R},this.svg);
    this.gE=mk('g',{},this.svg);const gN=mk('g',{},this.svg);this.gM=mk('g',{},this.svg);
    this.nodes=this.pos.map((p,i)=>{
      const g=mk('g',{class:'node'},gN);
      const b=mk('g',{class:'bump'},g);
      if(OPMAP[this.op].root&&i===this.root){mk('circle',{class:'rr',cx:p.x,cy:p.y,r:40},b);}
      mk('circle',{class:'nc',cx:p.x,cy:p.y,r:31},b);
      mk('text',{class:'nt',x:p.x,y:p.y-(OPMAP[this.op].root&&i===this.root?5:0)},b).textContent='P'+i;
      if(OPMAP[this.op].root&&i===this.root) mk('text',{class:'rl',x:p.x,y:p.y+13},b).textContent='root';
      const lab=mk('g',{class:'lab'},g);const rect=mk('rect',{rx:14,height:28},lab);const tx=mk('text',{},lab);
      return{g,rect,tx,p};
    });
  }
  render(pulse){
    const s=this.states[this.cur];
    this.nodes.forEach((n,i)=>{
      const txt=fmt(s.v[i]);n.tx.textContent=txt;
      const w=Math.max(46,txt.length*8.2+24),{p}=n;
      const lx=p.x,ly=p.y+this.off;
      n.rect.setAttribute('x',lx-w/2);n.rect.setAttribute('y',ly-14);n.rect.setAttribute('width',w);
      n.tx.setAttribute('x',lx);n.tx.setAttribute('y',ly+1);
      n.g.classList.toggle('dim',!!s.dim[i]);n.g.classList.remove('act');
      if(pulse&&pulse.has(i)){n.g.classList.remove('pulse');void n.g.getBBox;requestAnimationFrame(()=>n.g.classList.add('pulse'))}
    });
  }
  emit(){this.onUpdate(this)}
  animate(ph,t){
    const {W,H}=this,cx=W/2,cy=H/2;
    const items=ph.msgs.map(m=>{
      const a=this.pos[m.f],b=this.pos[m.t];
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,c={x:mx+(cx-mx)*.38,y:my+(cy-my)*.38};
      mk('path',{class:'edge',d:`M${a.x},${a.y} Q${c.x},${c.y} ${b.x},${b.y}`},this.gE);
      const g=mk('g',{class:'msg'},this.gM);const w=Math.max(30,m.l.length*7.4+18);
      mk('rect',{x:-w/2,y:-13,width:w,height:26,rx:13},g);mk('text',{x:0,y:1},g).textContent=m.l;
      this.nodes[m.f].g.classList.add('act');this.nodes[m.t].g.classList.add('act');
      return{a,b,c,g};
    });
    return new Promise(res=>{
      const dur=1050/this.speed,st=performance.now();
      const fr=now=>{
        if(t!==this.tok){res(false);return}
        const k=Math.min(1,(now-st)/dur),e=ease(k),u=1-e;
        items.forEach(it=>{const x=u*u*it.a.x+2*u*e*it.c.x+e*e*it.b.x,y=u*u*it.a.y+2*u*e*it.c.y+e*e*it.b.y;it.g.setAttribute('transform',`translate(${x},${y}) scale(${.6+.4*Math.sin(Math.PI*Math.min(1,k*1.4))})`)});
        if(k<1)requestAnimationFrame(fr);else{this.gM.innerHTML='';this.gE.innerHTML='';res(true)}
      };
      requestAnimationFrame(fr);
    });
  }
  async fwd(){
    if(this.busy||this.cur>=this.phases.length)return false;
    this.busy=true;const t=this.tok,ph=this.phases[this.cur];this.emit();
    this.pending=this.animate(ph,t);const ok=await this.pending;if(!ok||t!==this.tok)return false;
    this.cur++;this.busy=false;this.render(new Set(ph.msgs.map(m=>m.t)));this.emit();return true;
  }
  back(){if(this.busy)return;if(this.cur>0){this.cur--;this.render();this.emit()}}
  async play(){
    if(this.playing){this.playing=false;this.emit();return}
    if(this.cur>=this.phases.length){this.cur=0;this.render()}
    this.playing=true;this.emit();const t=this.tok;
    while(this.playing&&t===this.tok&&this.cur<this.phases.length){if(this.busy){await this.pending;await sleep(30);continue}const ok=await this.fwd();if(!ok)break;if(this.cur<this.phases.length)await sleep(280/this.speed)}
    if(t===this.tok){this.playing=false;this.emit()}
  }
  reset(){this.cancel();this.cur=0;this.render();this.emit()}
  cancel(){this.tok++;this.playing=false;this.busy=false;if(this.gM)this.gM.innerHTML='';if(this.gE)this.gE.innerHTML='';if(this.nodes)this.nodes.forEach(n=>n.g.classList.remove('act'))}
}

    else if(b.widget==='amdahl')h+=`<div class="amd" id="amd"><div class="row"><div><label>${T('amd_f')}<b id="afv"></b></label><input type="range" id="af" min="0" max="50" value="${store.get('af',10)}"></div><div><label>${T('amd_p')}<b id="apv"></b></label><input type="range" id="ap" min="0" max="10" value="${store.get('ap',5)}"></div></div><div class="out"><div><b id="aS"></b><span>${T('amd_s')}</span></div><div><b id="aE"></b><span>${T('amd_e')}</span></div><div><b id="aL"></b><span>${T('amd_l')}</span></div></div><svg id="aSvg" viewBox="0 0 600 220"></svg></div>`;
  });
  const isRead=READ.includes(curMod);
  h+=`<div class="art-foot"><button class="btn sec sm mark ${isRead?'done':''}" id="markBtn">${isRead?ICON.check+T('marked'):T('mark')}</button><div class="nav2">${curMod>0?`<button class="btn sec sm" data-go="${curMod-1}">${ICON.back}${T('prev')}</button>`:''}${curMod<MODS.length-1?`<button class="btn pri sm" data-go="${curMod+1}">${T('next')}${ICON.arr}</button>`:''}</div></div>`;
  $('#art').innerHTML=h;
  if($('#amd'))initAmdahl();
}
$('#mods').addEventListener('click',e=>{const b=e.target.closest('[data-mod]');if(b)gotoMod(+b.dataset.mod)});
$('#art').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return gotoMod(+g.dataset.go);
  const s=e.target.closest('[data-sim]');if(s)return openSim(s.dataset.sim);
  if(e.target.closest('#markBtn')){READ=READ.includes(curMod)?READ.filter(x=>x!==curMod):[...READ,curMod];store.set('read',READ);renderTheory()}
});
function gotoMod(i){curMod=i;store.set('mod',i);const a=$('#art');a.style.animation='none';void a.offsetWidth;a.style.animation='viewIn .7s var(--smooth)';renderTheory();window.scrollTo({top:0,behavior:'smooth'})}
function initAmdahl(){
  const f=$('#af'),p=$('#ap');
  const upd=()=>{
    const fv=f.value/100,pe=+p.value,pv=2**pe;rangeFill(f);rangeFill(p);store.set('af',+f.value);store.set('ap',pe);
    const S=x=>1/(fv+(1-fv)/x),s=S(pv),num=x=>x.toLocaleString(LANG==='ru'?'ru-RU':'kk-KZ',{maximumFractionDigits:2});
    $('#afv').textContent=f.value+'%';$('#apv').textContent=pv;$('#aS').textContent=num(s)+'×';$('#aE').textContent=Math.round(s/pv*100)+'%';$('#aL').textContent=fv>0?num(1/fv)+'×':T('amd_inf');
    const W=600,H=220,pl=40,pb=28,pt=12,pr=12,ymax=Math.max(2,S(1024))*1.08;
    const X=e=>pl+(W-pl-pr)*e/10,Y=v=>H-pb-(H-pb-pt)*(v-1)/(ymax-1);
    let d='';for(let e=0;e<=10;e+=.1)d+=(e?'L':'M')+X(e).toFixed(1)+','+Y(S(2**e)).toFixed(1);
    const css=getComputedStyle(document.documentElement),ink=css.getPropertyValue('--ink'),mut=css.getPropertyValue('--muted'),ln=css.getPropertyValue('--line2');
    let g=`<line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="${ln}"/><line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="${ln}"/>`;
    [0,2,4,6,8,10].forEach(e=>g+=`<text x="${X(e)}" y="${H-8}" font-size="11" fill="${mut}" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">${2**e}</text>`);
    [1,ymax/2,ymax/1.08].forEach(v=>g+=`<text x="${pl-8}" y="${Y(v)+4}" font-size="11" fill="${mut}" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace">${Math.round(v)}</text>`);
    if(fv>0&&1/fv<=ymax)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(1/fv)}" y2="${Y(1/fv)}" stroke="${mut}" stroke-dasharray="4 5"/>`;
    g+=`<path d="${d}" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/><circle cx="${X(pe)}" cy="${Y(s)}" r="7" fill="${ink}"/><circle cx="${X(pe)}" cy="${Y(s)}" r="13" fill="${ink}" opacity=".12"/>`;
    $('#aSvg').innerHTML=g;
  };
  f.oninput=upd;p.oninput=upd;upd();
}

/* ---------- quiz ---------- */
const Q={state:'start',filter:store.get('qf',-1),pool:[],i:0,ans:[],picked:null,checked:false};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQuiz(){
  const el=$('#quiz');let h='';
  if(Q.state==='start'){
    const n=QUIZ.filter(q=>Q.filter<0||q.m===Q.filter).length;
    h=`<div class="sec-head"><div class="eyebrow">${T('q_eyebrow')}</div><h2 class="h2">${T('q_title')}</h2><p class="sub">${T('q_sub')}</p></div><div class="qcard glass"><div class="chips" style="margin-top:0"><button data-qf="-1" class="${Q.filter<0?'on':''}">${T('q_all')}</button>${MODS.map((m,i)=>QUIZ.some(q=>q.m===i)?`<button data-qf="${i}" class="${Q.filter===i?'on':''}">${L(m.title)}</button>`:'').join('')}</div><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px"><div><b style="font-family:'Inter Tight',Inter,sans-serif;font-size:40px;letter-spacing:-.04em">${n}</b> <span style="color:var(--muted)">${T('q_count')}</span>${BEST!=null?`<div style="color:var(--muted);font-size:14px;margin-top:4px">${T('q_best')}: ${BEST}%</div>`:''}</div><button class="btn pri" id="qStart">${T('q_start')}${ICON.arr}</button></div></div>`;
  }else if(Q.state==='q'){
    const q=Q.pool[Q.i],n=Q.pool.length;
    h=`<div class="qcard glass"><div class="qtop"><span>${T('q_q')} <b>${Q.i+1} / ${n}</b></span><span>${L(MODS[q.m].title)}</span></div><div class="liq"><i style="width:${(Q.i+(Q.checked?1:0))/n*100}%"></i></div><div class="qq">${L(q.q)}</div><div class="opts ${Q.checked?'locked':''}">${q.o.map((o,j)=>{let c='';if(Q.checked){c=j===q.a?'ok':j===Q.picked?'bad':'mute'}else if(j===Q.picked)c='sel';return`<button class="opt ${c}" data-opt="${j}"><span class="k">${'ABCD'[j]}</span><span>${L(o)}</span></button>`}).join('')}</div>${Q.checked?`<div class="expl"><b>${Q.picked===q.a?T('q_ok'):T('q_bad')}</b>${esc(L(q.e))}</div>`:''}<div class="qact">${Q.checked?`<button class="btn pri" id="qNext">${Q.i<n-1?T('q_next'):T('q_finish')}${ICON.arr}</button>`:`<button class="btn pri" id="qCheck" ${Q.picked==null?'disabled style="opacity:.4;pointer-events:none"':''}>${T('q_check')}</button>`}</div></div>`;
  }else{
    const n=Q.pool.length,ok=Q.ans.filter((a,i)=>a===Q.pool[i].a).length,pct=Math.round(ok/n*100);
    const wrong=Q.pool.map((q,i)=>({q,a:Q.ans[i]})).filter(x=>x.a!==x.q.a);
    h=`<div class="qcard glass res"><div class="eyebrow">${T('q_res')}</div><div class="big" style="margin:14px 0 6px">${ok}<small> / ${n}</small></div><div class="liq" style="max-width:360px;margin:18px auto 18px"><i style="width:${pct}%"></i></div><p class="sub" style="margin:0 auto">${pct>=90?T('q_r1'):pct>=60?T('q_r2'):T('q_r3')}</p><div style="display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap"><button class="btn pri" id="qAgain">${T('q_again')}</button><a class="btn sec" href="#theory">${T('q_toth')}</a></div>${wrong.length?`<div class="rev"><div class="eyebrow" style="background:none;padding:0;margin-top:10px">${T('q_rev')}</div>${wrong.map(x=>`<div class="w"><b>${L(x.q.q)}</b>${T('q_ans')} ${L(x.q.o[x.q.a])}</div>`).join('')}</div>`:''}</div>`;
  }
  el.innerHTML=h;
}
$('#quiz').addEventListener('click',e=>{
  const f=e.target.closest('[data-qf]');if(f){Q.filter=+f.dataset.qf;store.set('qf',Q.filter);return renderQuiz()}
  if(e.target.closest('#qStart')||e.target.closest('#qAgain')){Q.pool=shuffle(QUIZ.filter(q=>Q.filter<0||q.m===Q.filter));Q.i=0;Q.ans=[];Q.picked=null;Q.checked=false;Q.state='q';return renderQuiz()}
  const o=e.target.closest('[data-opt]');if(o&&!Q.checked){Q.picked=+o.dataset.opt;return renderQuiz()}
  if(e.target.closest('#qCheck')&&Q.picked!=null){Q.checked=true;Q.ans[Q.i]=Q.picked;return renderQuiz()}
  if(e.target.closest('#qNext')){
    if(Q.i<Q.pool.length-1){Q.i++;Q.picked=null;Q.checked=false}
    else{Q.state='done';const ok=Q.ans.filter((a,i)=>a===Q.pool[i].a).length,pct=Math.round(ok/Q.pool.length*100);if(Q.filter<0&&(BEST==null||pct>BEST)){BEST=pct;store.set('best',pct)}}
    renderQuiz();window.scrollTo({top:0,behavior:'smooth'});
  }
});

/* ---------- tasks ---------- */
let tFilter=-1;const tOpen=new Set(),tHint=new Set(),tSol=new Set();
function renderTasks(){
  $('#tfil').innerHTML=`<button data-tf="-1" class="${tFilter<0?'on':''}">${T('tk_all')}</button>`+GROUPS.map((g,i)=>`<button data-tf="${i}" class="${tFilter===i?'on':''}">${L(g)}</button>`).join('');
  $('#tlist').innerHTML=TASKS.map((t,i)=>tFilter>=0&&t.g!==tFilter?'':`<div class="task glass ${tOpen.has(i)?'open':''} ${DONE.includes(i)?'done':''}" data-t="${i}"><button class="hd" data-tog="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="tt"><b>${L(t.t)}</b><span>${L(GROUPS[t.g])}</span></span><span class="lvl">${[1,2,3].map(k=>`<i class="${k<=t.l?'f':''}"></i>`).join('')}</span><span class="dn">${ICON.check}</span>${ICON.chev}</button><div class="acc"><div><div class="tb2"><p>${esc(L(t.d)).replace(/\b(MPI_[A-Za-z_0-9]+)/g,'<code class="inl">$1</code>')}</p><div class="row"><button class="btn sec sm" data-hint="${i}">${T('tk_hint')}</button><button class="btn sec sm" data-sol="${i}">${T('tk_sol')}</button>${t.sim?`<button class="pill" data-sim="${t.sim}">${OPMAP[t.sim].name}</button>`:''}<button class="btn sm ${DONE.includes(i)?'sec mark done':'pri'}" data-done="${i}" style="margin-left:auto">${DONE.includes(i)?ICON.check+T('tk_done'):T('tk_mark')}</button></div>${tHint.has(i)?`<div class="hint">${esc(L(t.h))}</div>`:''}${tSol.has(i)?codeBlock(t.c,'c','solution.c'):''}</div></div></div></div>`).join('');
}
$('#tfil').addEventListener('click',e=>{const b=e.target.closest('[data-tf]');if(b){tFilter=+b.dataset.tf;renderTasks()}});
$('#tlist').addEventListener('click',e=>{
  let b;
  if((b=e.target.closest('[data-tog]'))){const i=+b.dataset.tog;const card=b.closest('.task');tOpen.has(i)?tOpen.delete(i):tOpen.add(i);card.classList.toggle('open');return}
  if((b=e.target.closest('[data-hint]'))){const i=+b.dataset.hint;tHint.has(i)?tHint.delete(i):tHint.add(i);return renderTasks()}
  if((b=e.target.closest('[data-sol]'))){const i=+b.dataset.sol;tSol.has(i)?tSol.delete(i):tSol.add(i);return renderTasks()}
  if((b=e.target.closest('[data-done]'))){const i=+b.dataset.done;DONE=DONE.includes(i)?DONE.filter(x=>x!==i):[...DONE,i];store.set('done',DONE);return renderTasks()}
  if((b=e.target.closest('[data-sim]')))openSim(b.dataset.sim);
});

/* ---------- install ---------- */
let instTab=0;
function renderInstall(){
  const t=INSTALL[instTab];
  $('#inst').innerHTML=`<div class="seg" id="instSeg"><span class="thumb"></span>${INSTALL.map((x,i)=>`<button data-it="${i}" class="${i===instTab?'on':''}">${x.n}</button>`).join('')}</div><div id="instBody" style="animation:viewIn .6s var(--smooth)">${t.b.map(b=>b.p?`<p>${esc(L(b.p))}</p>`:codeBlock(b.code,b.lang,b.file)).join('')}</div>`;
  placeThumb($('#instSeg'));
}
$('#inst').addEventListener('click',e=>{const b=e.target.closest('[data-it]');if(b){instTab=+b.dataset.it;renderInstall()}});

/* ---------- segmented thumbs, nav indicator ---------- */
function placeThumb(seg){const on=seg.querySelector('button.on'),th=seg.querySelector('.thumb');if(!on||!th)return;th.style.left=on.offsetLeft+'px';th.style.width=on.offsetWidth+'px'}
function moveInd(a){const ind=$('#ind');if(!a){ind.style.opacity=0;return}ind.style.opacity=1;ind.style.left=a.offsetLeft+'px';ind.style.width=a.offsetWidth+'px'}
const links=$('#links');
links.addEventListener('pointerover',e=>{const a=e.target.closest('a');if(a)moveInd(a)});
links.addEventListener('pointerleave',()=>moveInd($('#links a.on')));

/* ---------- i18n ---------- */
function applyStatic(){
  document.documentElement.lang=LANG==='ru'?'ru':'kk';
  $$('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
  $$('[data-i18n-html]').forEach(e=>e.innerHTML=T(e.dataset.i18nHtml));
  $$('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
}
function renderAll(){
  applyStatic();renderHome();renderTheory();renderQuiz();renderTasks();renderInstall();
  const o=OPMAP[simOp];$('#simDesc').textContent=L(o.d);$('#simCode').innerHTML=codeBlock(o.code(simNp,simRoot),'c',o.name);
  sim.render();sim.emit();hero.render&&hero.states&&hero.render();
  requestAnimationFrame(()=>{placeThumb($('#langSeg'));moveInd($('#links a.on'));setWord()});
}
$('#langSeg').addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]');if(!b||b.dataset.lang===LANG)return;
  LANG=b.dataset.lang;store.set('lang',LANG);
  $$('#langSeg button').forEach(x=>x.classList.toggle('on',x===b));placeThumb($('#langSeg'));
  document.body.classList.add('swap');
  setTimeout(()=>{renderAll();document.body.classList.remove('swap')},220);
});

/* ---------- theme ---------- */
const sysDark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
document.documentElement.dataset.theme=store.get('theme',sysDark?'dark':'light');
$('#themeBtn').addEventListener('click',e=>{
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  const apply=()=>{document.documentElement.dataset.theme=next;store.set('theme',next);if($('#amd'))initAmdahl()};
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!document.startViewTransition||reduce){apply();return}
  const x=e.clientX,y=e.clientY,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const vt=document.startViewTransition(apply);
  vt.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:750,easing:'cubic-bezier(.7,0,.2,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
});

/* ---------- pointer effects ---------- */
let raf=0;
document.addEventListener('pointermove',e=>{
  const t=e.target.closest&&e.target.closest('.glass.lift,.btn');
  if(t){const r=t.getBoundingClientRect();t.style.setProperty('--sx',(e.clientX-r.left)+'px');t.style.setProperty('--sy',(e.clientY-r.top)+'px')}
  if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const bg=$('#bg');bg.style.setProperty('--mx',(e.clientX/innerWidth-.5).toFixed(3));bg.style.setProperty('--my',(e.clientY/innerHeight-.5).toFixed(3))});
},{passive:true});

/* ---------- router ---------- */
const VIEWS=['home','theory','simulator','tests','tasks','install'];
function route(){
  let v=location.hash.slice(1);if(!VIEWS.includes(v))v='home';
  if(v===current)return;
  if(current==='simulator')sim.cancel(),sim.render(),sim.emit();
  current=v;
  $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  $$('#links a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  moveInd($('#links a.on'));
  const la=$('#links a.on');if(la&&links.scrollWidth>links.clientWidth)links.scrollTo({left:la.offsetLeft-40,behavior:'smooth'});
  $('#pg').textContent=String(VIEWS.indexOf(v)+1).padStart(2,'0')+' / '+String(VIEWS.length).padStart(2,'0');
  if(v==='home'){renderHome();requestAnimationFrame(setWord)}
  if(v==='tests'&&Q.state==='done'){}
  window.scrollTo({top:0});
}
window.addEventListener('hashchange',route);
window.addEventListener('resize',()=>{placeThumb($('#langSeg'));moveInd($('#links a.on'));if($('#instSeg'))placeThumb($('#instSeg'));setWord()});

/* ---------- init ---------- */
buildOps();$('#np').value=simNp;$('#npVal').textContent=simNp;rangeFill($('#np'));rangeFill($('#speed'));
loadSim();
applyStatic();renderTheory();renderQuiz();renderTasks();renderInstall();
route();renderHome();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{placeThumb($('#langSeg'));moveInd($('#links a.on'));setWord()});
setTimeout(()=>{placeThumb($('#langSeg'));moveInd($('#links a.on'));setWord()},300);
</script>
</body>
</html>
