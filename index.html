<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPI Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --ink:#0E1117; --ink2:#3A4150; --muted:#8C95A6; --faint:#CDD2DB;
  --line:rgba(14,17,23,.08); --line2:rgba(14,17,23,.16);
  --glass:rgba(255,255,255,.52); --glass2:rgba(255,255,255,.82); --gb:rgba(255,255,255,.85); --ghi:rgba(255,255,255,.9);
  --shadow:0 24px 60px -28px rgba(70,86,118,.45), 0 2px 8px -4px rgba(70,86,118,.12);
  --fogA:#EEF1F6; --fogB:#A9B4C6;
  --blob1:#D9E0EB; --blob2:#BCC6D6; --blob3:#F6F7FA;
  --code:rgba(14,17,23,.035); --seg:rgba(14,17,23,.05);
  --node:#FFFFFF; --pill:rgba(255,255,255,.92);
  --ok:#3F8566; --okbg:rgba(63,133,102,.10); --bad:#B5564E; --badbg:rgba(181,86,78,.09);
  --kw:#5A58C8; --fn:#2D6F8E; --str:#A0573A; --num:#A5701C; --com:#9AA3B3; --pp:#7A5AA8;
  --spring:cubic-bezier(.34,1.4,.64,1); --smooth:cubic-bezier(.2,.8,.2,1);
}
[data-theme="dark"]{
  --bg:#0B0E13; --ink:#E9EDF4; --ink2:#B4BCC9; --muted:#7C8698; --faint:#2F3646;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.16);
  --glass:rgba(22,27,37,.5); --glass2:rgba(30,37,50,.85); --gb:rgba(255,255,255,.08); --ghi:rgba(255,255,255,.07);
  --shadow:0 30px 70px -30px rgba(0,0,0,.7), 0 2px 8px -4px rgba(0,0,0,.4);
  --fogA:#2C3445; --fogB:#10141C;
  --blob1:#1B2331; --blob2:#212A3B; --blob3:#121722;
  --code:rgba(255,255,255,.035); --seg:rgba(255,255,255,.06);
  --node:#1A2130; --pill:rgba(24,30,42,.92);
  --ok:#6FC09A; --okbg:rgba(111,192,154,.10); --bad:#E58A80; --badbg:rgba(229,138,128,.10);
  --kw:#A9AEFF; --fn:#86C5E0; --str:#E3A483; --num:#E3C17D; --com:#5E697C; --pp:#C3A6F0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;transition:background-color .6s,color .6s;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--fogB);color:#0E1117}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bw{position:absolute;transition:transform 1.4s var(--smooth)}
.blob{width:100%;height:100%;border-radius:50%;filter:blur(70px);animation:drift 30s ease-in-out infinite alternate}
.w1{width:60vmax;height:60vmax;top:-24vmax;left:-14vmax;transform:translate(calc(var(--mx,0)*-26px),calc(var(--my,0)*-26px))}
.w2{width:58vmax;height:58vmax;bottom:-28vmax;right:-18vmax;transform:translate(calc(var(--mx,0)*30px),calc(var(--my,0)*30px))}
.w3{width:38vmax;height:38vmax;top:28%;left:38%;transform:translate(calc(var(--mx,0)*18px),calc(var(--my,0)*-18px))}
.w1 .blob{background:radial-gradient(circle at 35% 35%,var(--blob1),transparent 68%)}
.w2 .blob{background:radial-gradient(circle at 50% 50%,var(--blob2),transparent 66%);animation-duration:36s}
.w3 .blob{background:radial-gradient(circle at 50% 50%,var(--blob3),transparent 66%);animation-duration:42s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,4%) scale(1.08)}100%{transform:translate(-4%,7%) scale(.96)}}
.grain{position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* glass */
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--gb);border-radius:28px;box-shadow:var(--shadow),inset 0 1px 0 var(--ghi);position:relative;transition:background-color .6s,border-color .6s,box-shadow .6s}
.glass.lift::after,.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(420px circle at var(--sx,50%) var(--sy,0%),rgba(255,255,255,.38),transparent 45%)}
[data-theme="dark"] .glass.lift::after,[data-theme="dark"] .btn::after{background:radial-gradient(420px circle at var(--sx,50%) var(--sy,0%),rgba(255,255,255,.07),transparent 45%)}
.glass.lift:hover::after,.btn:hover::after{opacity:1}

/* nav */
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(1200px,calc(100% - 32px));z-index:50;display:flex;align-items:center;gap:16px;padding:10px 10px 10px 22px;border-radius:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.sphere{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0%,#E3E8F0 35%,#A9B4C6 100%);box-shadow:0 2px 6px rgba(80,95,125,.35);flex:none}
.links{position:relative;display:flex;gap:2px;margin:0 auto;padding:4px;border-radius:999px;background:var(--seg)}
.links a{position:relative;z-index:1;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);transition:color .4s;white-space:nowrap}
.links a.on,.links a:hover{color:var(--ink)}
.ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--glass2);box-shadow:0 6px 18px -8px rgba(60,75,105,.45),inset 0 1px 0 var(--ghi);transition:left .55s var(--spring),width .55s var(--spring),opacity .3s}
.tools{display:flex;align-items:center;gap:8px}
.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:var(--seg)}
.seg button{position:relative;z-index:1;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:color .4s;letter-spacing:.02em}
.seg button.on{color:var(--ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--glass2);box-shadow:0 6px 16px -8px rgba(60,75,105,.5),inset 0 1px 0 var(--ghi);transition:left .55s var(--spring),width .55s var(--spring)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--seg);transition:transform .5s var(--spring),background-color .4s}
.icon-btn:hover{transform:rotate(-14deg) scale(1.06)}
.icon-btn svg{width:19px;height:19px}
.i-sun,.i-moon{transition:transform .6s var(--spring),opacity .4s;position:absolute}
.icon-btn{position:relative}
[data-theme="light"] .i-sun{opacity:0;transform:rotate(-90deg) scale(.5)}
[data-theme="dark"] .i-moon{opacity:0;transform:rotate(90deg) scale(.5)}

/* layout */
main{transition:opacity .22s,filter .22s}
body.swap main{opacity:0;filter:blur(6px)}
.wrap{width:min(1200px,calc(100% - 32px));margin:0 auto;padding:128px 0 40px}
.view{display:none}
.view.on{display:block;animation:viewIn .8s var(--smooth)}
@keyframes viewIn{from{opacity:0;transform:translateY(18px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.035em;line-height:1.05}
.h2{font-size:clamp(32px,4.4vw,52px);font-weight:700;margin:10px 0 14px}
.sub{color:var(--ink2);font-size:17px;max-width:640px;line-height:1.6}
.sec-head{margin:0 0 28px}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .5s var(--spring),background-color .4s,box-shadow .5s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg);box-shadow:0 14px 30px -14px rgba(14,17,23,.55)}
.btn.sec{background:var(--glass2);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--ghi)}
.btn svg{width:16px;height:16px;transition:transform .5s var(--spring)}
.btn:hover svg.arr{transform:translateX(3px)}
.btn.sm{padding:10px 16px;font-size:14px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:end;margin-bottom:40px}
.words{position:relative;padding-left:44px}
.words div{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:700;font-size:clamp(46px,6.6vw,92px);letter-spacing:-.05em;line-height:1;color:var(--faint);transition:color .9s var(--smooth)}
.words div.on{color:var(--ink)}
.words .sphere{position:absolute;left:0;top:0;width:26px;height:26px;transition:transform .9s var(--spring)}
.hero-copy h1{font-size:clamp(30px,3.4vw,44px);font-weight:700;margin:12px 0 16px}
.hero-copy .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.fogcard{position:relative;border-radius:36px;overflow:hidden;background:radial-gradient(120% 110% at 28% 30%,var(--fogA) 0%,var(--fogA) 18%,var(--fogB) 100%);box-shadow:0 40px 80px -40px rgba(70,86,118,.6),inset 0 1px 0 rgba(255,255,255,.6);transition:background .8s}
.fogcard::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 40% at 50% 50%,rgba(255,255,255,.45),transparent 70%);animation:sheen 16s ease-in-out infinite alternate;pointer-events:none}
[data-theme="dark"] .fogcard::before{background:radial-gradient(40% 40% at 50% 50%,rgba(169,180,198,.12),transparent 70%)}
@keyframes sheen{from{transform:translate(-18%,-10%)}to{transform:translate(20%,14%)}}
.fogcard svg{display:block;width:100%;height:auto;position:relative}
.chip{position:absolute;display:inline-flex;align-items:center;gap:10px;padding:11px 18px 11px 14px;border-radius:999px;background:rgba(255,255,255,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8);box-shadow:0 10px 24px -14px rgba(60,75,105,.6);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:500;color:#0E1117;transition:all .6s var(--spring)}
[data-theme="dark"] .chip{background:rgba(30,37,50,.7);border-color:rgba(255,255,255,.1);color:var(--ink)}
.chip .d{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:#A9B4C6;box-shadow:0 0 0 1px rgba(14,17,23,.06)}
.chip.l .d{background:#EEF1F6}
.chip.bl{left:22px;bottom:22px}.chip.br{right:22px;bottom:22px}
.chip.tr{right:22px;top:22px;font-family:Inter,system-ui,sans-serif;font-size:13px;color:#5A6478;background:rgba(255,255,255,.4)}
[data-theme="dark"] .chip.tr{color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0 72px}
.stat{padding:24px 26px;border-radius:24px}
.stat b{display:block;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
.stat span{color:var(--muted);font-size:14px}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:72px}
.feat{padding:26px;border-radius:28px;display:flex;flex-direction:column;gap:12px;min-height:250px;transition:transform .6s var(--spring),background-color .6s}
.feat:hover{transform:translateY(-6px)}
.feat .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--seg)}
.feat .ic svg{width:22px;height:22px}
.feat h3{font-size:22px;font-weight:600;margin-top:8px}
.feat p{color:var(--ink2);font-size:15px;line-height:1.55;flex:1}
.feat .go{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.feat .go svg{width:16px;height:16px;transition:transform .5s var(--spring)}
.feat:hover .go svg{transform:translateX(4px)}
.feat.star{background:linear-gradient(160deg,var(--glass2),var(--glass))}
.feat .tag{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--ink);color:var(--bg)}
.prog{display:grid;grid-template-columns:1.1fr 2fr;gap:24px;padding:34px;border-radius:32px;align-items:center}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:84px;height:84px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .tr{stroke:var(--line)}
.ring .fg{stroke:url(#rg);transition:stroke-dashoffset 1.4s var(--smooth)}
.ring b{display:block;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:24px;letter-spacing:-.03em}
.ring span{font-size:13px;color:var(--muted);line-height:1.35;display:block}

/* theory */
.th{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
.mods{position:sticky;top:110px;padding:10px;border-radius:26px;display:flex;flex-direction:column;gap:2px}
.mods button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px;font-size:14px;font-weight:500;color:var(--ink2);transition:background-color .4s,color .4s,transform .5s var(--spring)}
.mods button:hover{background:var(--seg);transform:translateX(3px)}
.mods button.on{background:var(--glass2);color:var(--ink);box-shadow:0 8px 20px -12px rgba(60,75,105,.45),inset 0 1px 0 var(--ghi)}
.mods .n{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);width:20px;flex:none}
.mods .t{flex:1;line-height:1.3}
.mods .ck{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--line2);transition:all .5s var(--spring)}
.mods .ck.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mods .ck svg{width:11px;height:11px;opacity:0;transition:opacity .3s}
.mods .ck.done svg{opacity:1}
.art{padding:48px 52px;border-radius:32px}
.art h2{font-size:clamp(30px,3.6vw,44px);font-weight:700;margin:10px 0 14px}
.art .lead{font-size:19px;color:var(--ink);line-height:1.55;margin-bottom:28px;max-width:760px}
.art p{color:var(--ink2);font-size:16.5px;line-height:1.75;margin:0 0 18px;max-width:760px}
.art h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:30px 0 12px}
.art code,.inl{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.88em;padding:2px 6px;border-radius:6px;background:var(--code);border:1px solid var(--line)}
.code{margin:8px 0 24px;border-radius:20px;background:var(--code);border:1px solid var(--line);overflow:hidden}
.code .bar{display:flex;justify-content:space-between;align-items:center;padding:9px 12px 9px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-family:"JetBrains Mono",ui-monospace,monospace}
.code .cp{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:background-color .3s,color .3s}
.code .cp:hover{background:var(--seg);color:var(--ink)}
.code .cp svg{width:13px;height:13px}
.code pre{padding:18px 20px;overflow:auto;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7;color:var(--ink);tab-size:4}
.tk-kw{color:var(--kw)}.tk-fn{color:var(--fn);font-weight:500}.tk-str{color:var(--str)}.tk-num{color:var(--num)}.tk-com{color:var(--com);font-style:italic}.tk-pp{color:var(--pp)}
.tbl{width:100%;border-collapse:collapse;margin:6px 0 24px;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.tbl td:first-child{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--ink);white-space:nowrap}
.pts{list-style:none;display:grid;gap:10px;margin:4px 0 24px}
.pts li{position:relative;padding:14px 18px 14px 44px;border-radius:16px;background:var(--seg);color:var(--ink);font-size:15px;line-height:1.5}
.pts li::before{content:"";position:absolute;left:18px;top:19px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#A9B4C6)}
.simlink{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 18px;border-radius:20px;border:1px dashed var(--line2);margin:8px 0 24px}
.simlink span{font-size:14px;color:var(--muted);margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--glass2);border:1px solid var(--gb);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:500;transition:transform .5s var(--spring),background-color .3s}
.pill:hover{transform:translateY(-2px)}
.art-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.art-foot .nav2{display:flex;gap:8px}
.mark.done{background:var(--okbg);color:var(--ok)}
.amd{padding:24px;border-radius:24px;background:var(--seg);margin:8px 0 26px}
.amd .row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}
.amd label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.amd label b{color:var(--ink);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-weight:500;margin-left:6px}
.amd .out{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.amd .out div{padding:14px 16px;border-radius:16px;background:var(--glass2)}
.amd .out b{display:block;font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:26px;letter-spacing:-.03em}
.amd .out span{font-size:12.5px;color:var(--muted)}
.amd svg{width:100%;height:auto;display:block}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--ink) var(--p,50%),var(--line2) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#DCE2EB 45%,#A9B4C6);box-shadow:0 4px 10px rgba(40,50,70,.35);cursor:pointer;transition:transform .4s var(--spring)}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#DCE2EB 45%,#A9B4C6);box-shadow:0 4px 10px rgba(40,50,70,.35);cursor:pointer}

/* simulator */
.sim{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:20px;align-items:start}
.ctrl{padding:20px;border-radius:26px;display:flex;flex-direction:column;gap:20px;position:sticky;top:110px}
.ctrl h5{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between}
.ctrl h5 b{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);font-weight:500;letter-spacing:0}
.ops{display:flex;flex-direction:column;gap:2px}
.ops button{text-align:left;padding:10px 12px;border-radius:14px;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--ink2);transition:background-color .4s,color .4s,transform .5s var(--spring)}
.ops button:hover{background:var(--seg);transform:translateX(3px)}
.ops button.on{background:var(--glass2);color:var(--ink);box-shadow:0 8px 20px -12px rgba(60,75,105,.45),inset 0 1px 0 var(--ghi)}
.roots{display:flex;flex-wrap:wrap;gap:6px}
.roots button{width:34px;height:34px;border-radius:12px;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--seg);transition:all .4s var(--spring)}
.roots button.on{background:var(--ink);color:var(--bg)}
.roots.off{opacity:.35;pointer-events:none}
.stage{border-radius:32px;overflow:hidden;padding:0}
.stage .fogcard{border-radius:0;box-shadow:none}
.transport{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:var(--glass)}
.tb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--seg);transition:transform .5s var(--spring),background-color .3s}
.tb:hover{transform:scale(1.08)}
.tb:disabled{opacity:.35;pointer-events:none}
.tb svg{width:18px;height:18px}
.tb.play{width:52px;height:52px;background:var(--ink);color:var(--bg)}
.stepinfo{margin-left:auto;text-align:right}
.stepinfo b{display:block;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:500}
.stepinfo span{font-size:12.5px;color:var(--muted)}
.bar2{height:4px;background:var(--line);position:relative}
.bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0;transition:width .7s var(--spring);border-radius:0 4px 4px 0}
.side{display:flex;flex-direction:column;gap:16px}
.card{padding:22px;border-radius:24px}
.card h5{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
.card p{color:var(--ink2);font-size:14.5px;line-height:1.6}
.card .code{margin:0}
.card .code pre{font-size:12.5px;padding:14px 16px}
.log{list-style:none;max-height:240px;overflow:auto;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.log li{padding:6px 10px;border-radius:10px;background:var(--seg);display:flex;justify-content:space-between;gap:8px;animation:pop .5s var(--spring)}
.log li.h{background:none;color:var(--muted);padding:8px 2px 2px;font-family:Inter,system-ui,sans-serif;font-size:12px;font-weight:600}
.log .empty{color:var(--muted);font-family:Inter,system-ui,sans-serif;font-size:13.5px;background:none;padding:0}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.kbd{font-size:12px;color:var(--muted);line-height:1.6}
.kbd kbd{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--seg)}

svg .orbit{fill:none;stroke:rgba(14,17,23,.16);stroke-dasharray:2 7}
[data-theme="dark"] svg .orbit{stroke:rgba(255,255,255,.14)}
svg .nc{fill:var(--node);stroke:rgba(14,17,23,.1);stroke-width:1.5;transition:stroke .4s,opacity .5s,fill .6s}
[data-theme="dark"] svg .nc{stroke:rgba(255,255,255,.12)}
svg .node{transition:opacity .5s}
svg .node.dim{opacity:.42}
svg .node.act .nc{stroke:var(--ink);stroke-width:2.2}
svg .node .bump{transform-box:fill-box;transform-origin:center}
svg .node.pulse .bump{animation:bump .6s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
svg .nt{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-weight:600;font-size:18px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg .rr{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-dasharray:3 5;transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
svg .rl{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10px;fill:var(--muted);text-anchor:middle;letter-spacing:.06em}
@keyframes spin{to{transform:rotate(360deg)}}
svg .lab rect{fill:var(--pill);stroke:rgba(14,17,23,.08);transition:width .5s var(--spring),x .5s var(--spring)}
[data-theme="dark"] svg .lab rect{stroke:rgba(255,255,255,.08)}
svg .lab text{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg .edge{fill:none;stroke:var(--ink);stroke-opacity:.28;stroke-width:1.5;stroke-dasharray:4 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
svg .msg rect{fill:var(--ink)}
svg .msg text{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:500;fill:var(--bg);text-anchor:middle;dominant-baseline:central}

/* quiz */
.qz{max-width:820px;margin:0 auto}
.qcard{padding:40px 44px;border-radius:32px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 28px}
.chips button{padding:9px 15px;border-radius:999px;font-size:14px;font-weight:500;background:var(--seg);color:var(--ink2);transition:all .45s var(--spring)}
.chips button:hover{transform:translateY(-2px)}
.chips button.on{background:var(--ink);color:var(--bg)}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;color:var(--muted)}
.qtop b{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);font-weight:500}
.liq{height:8px;border-radius:999px;background:var(--seg);overflow:hidden;margin-bottom:30px}
.liq i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#C9D1DE,#8E9AB0,#C9D1DE);background-size:200% 100%;animation:shim 3s linear infinite;transition:width .9s var(--spring)}
[data-theme="dark"] .liq i{background:linear-gradient(90deg,#4A5568,#A9B4C6,#4A5568);background-size:200% 100%}
@keyframes shim{to{background-position:-200% 0}}
.qq{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:clamp(22px,2.6vw,28px);font-weight:600;letter-spacing:-.025em;line-height:1.25;margin-bottom:24px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--glass2);font-size:15.5px;transition:transform .5s var(--spring),border-color .3s,background-color .4s,opacity .4s}
.opt:hover{transform:translateX(4px);border-color:var(--line2)}
.opt .k{width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--seg);transition:all .4s}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.mute{opacity:.5}
.opts.locked .opt{pointer-events:none}
.opt code,.qq code{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.expl{margin-top:20px;padding:18px 20px;border-radius:18px;background:var(--seg);font-size:15px;color:var(--ink2);line-height:1.6;animation:pop .6s var(--spring)}
.expl b{color:var(--ink);display:block;margin-bottom:4px}
.qact{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.res{text-align:center}
.res .big{font-family:"Inter Tight",Inter,system-ui,sans-serif;font-size:96px;font-weight:700;letter-spacing:-.06em;line-height:1}
.res .big small{font-size:36px;color:var(--muted)}
.rev{text-align:left;margin-top:30px;display:grid;gap:10px}
.rev div{padding:14px 18px;border-radius:16px;background:var(--seg);font-size:14.5px;line-height:1.5}
.rev div b{display:block;margin-bottom:4px}
.rev .w{border-left:3px solid var(--bad)}

/* tasks */
.tfil{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tlist{display:grid;gap:12px}
.task{border-radius:24px;padding:0;overflow:hidden}
.task .hd{width:100%;display:flex;align-items:center;gap:16px;padding:20px 24px;text-align:left}
.task .num{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);width:26px}
.task .tt{flex:1}
.task .tt b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.task .tt span{font-size:13px;color:var(--muted)}
.lvl{display:flex;gap:4px}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.lvl i.f{background:var(--ink)}
.task .dn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;transition:all .5s var(--spring)}
.task .dn svg{width:12px;height:12px;opacity:0}
.task.done .dn{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done .dn svg{opacity:1}
.task .chev{width:18px;height:18px;transition:transform .6s var(--spring);color:var(--muted)}
.task.open .chev{transform:rotate(180deg)}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--smooth)}
.task.open .acc{grid-template-rows:1fr}
.acc>div{overflow:hidden}
.tb2{padding:0 24px 24px 66px}
.tb2 p{color:var(--ink2);font-size:15.5px;line-height:1.7;margin-bottom:16px}
.tb2 .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.hint{padding:14px 18px;border-radius:16px;background:var(--seg);font-size:14.5px;color:var(--ink2);margin-bottom:14px;animation:pop .5s var(--spring)}
.note{font-size:13px;color:var(--muted);margin-top:18px}

/* install */
.inst{padding:40px 44px;border-radius:32px}
.inst p{color:var(--ink2);font-size:16px;line-height:1.7;margin-bottom:14px;max-width:760px}
.inst .seg{margin-bottom:28px}

footer{width:min(1200px,calc(100% - 32px));margin:40px auto 0;padding:28px 4px 36px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer .pg{font-family:"JetBrains Mono",ui-monospace,monospace}

@media (max-width:1180px){
  .sim{grid-template-columns:230px minmax(0,1fr)}
  .side{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .feats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .nav{flex-wrap:wrap;padding:10px 10px 10px 18px;gap:10px}
  .tools{margin-left:auto}
  .links{order:3;width:100%;overflow-x:auto;margin:0;scrollbar-width:none}
  .links::-webkit-scrollbar{display:none}
  .wrap{padding-top:150px}
  .hero{grid-template-columns:minmax(0,1fr);gap:28px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .prog{grid-template-columns:1fr}
  .th{grid-template-columns:minmax(0,1fr)}
  .mods{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .mods button{flex:none}
  .mods .t{white-space:nowrap}
  .art,.qcard,.inst{padding:30px 24px}
  .sim{grid-template-columns:minmax(0,1fr)}
  .ctrl{position:static}
  .ops{flex-direction:row;flex-wrap:wrap}
  .side{grid-template-columns:minmax(0,1fr)}
  .tb2{padding:0 20px 22px 20px}
}
@media (max-width:600px){
  .feats,.rings{grid-template-columns:1fr}
  .stat b{font-size:34px}
  .chip{font-size:12px;padding:8px 13px 8px 10px}
  .chip .d{width:12px;height:12px}
  .chip.bl{left:12px;bottom:12px}.chip.br{right:12px;bottom:12px}.chip.tr{right:12px;top:12px}
  .amd .row,.amd .out{grid-template-columns:1fr}
  .seg button{padding:8px 11px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9D1DE"/><stop offset="1" stop-color="#6E7B93"/></linearGradient></defs></svg>
<div class="bg" id="bg"><div class="bw w1"><div class="blob"></div></div><div class="bw w2"><div class="blob"></div></div><div class="bw w3"><div class="blob"></div></div><div class="grain"></div></div>

<header class="nav glass">
  <a class="brand" href="#home"><span class="sphere"></span>MPI Atlas</a>
  <nav class="links" id="links">
    <span class="ind" id="ind"></span>
    <a href="#home" data-v="home" data-i18n="nav_home"></a>
    <a href="#theory" data-v="theory" data-i18n="nav_theory"></a>
    <a href="#simulator" data-v="simulator" data-i18n="nav_sim"></a>
    <a href="#tests" data-v="tests" data-i18n="nav_tests"></a>
    <a href="#tasks" data-v="tasks" data-i18n="nav_tasks"></a>
    <a href="#install" data-v="install" data-i18n="nav_install"></a>
  </nav>
  <div class="tools">
    <div class="seg" id="langSeg"><span class="thumb"></span><button data-lang="ru">RU</button><button data-lang="kk">KZ</button></div>
    <button class="icon-btn" id="themeBtn" aria-label="theme">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
    </button>
  </div>
</header>

<main>
<div class="wrap">

<!-- HOME -->
<section class="view" id="v-home">
  <div class="hero">
    <div class="words" id="words">
      <span class="sphere" id="wdot"></span>
      <div>Init</div><div>Send</div><div>Reduce</div><div>Finalize</div>
    </div>
    <div class="hero-copy">
      <div class="eyebrow" data-i18n="hero_eyebrow"></div>
      <h1 data-i18n="hero_title"></h1>
      <p class="sub" data-i18n="hero_sub"></p>
      <div class="actions">
        <a class="btn pri" href="#theory"><span data-i18n="hero_start"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a class="btn sec" href="#simulator" data-i18n="hero_sim"></a>
      </div>
    </div>
  </div>
  <div class="fogcard" id="heroCard">
    <svg id="heroSvg"></svg>
    <div class="chip tr" id="heroStep">01 / 01</div>
    <div class="chip bl l"><span class="d"></span><span id="heroOp">MPI_Allgather</span></div>
    <div class="chip br"><span class="d"></span><span>np = 6</span></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="sec-head"><div class="eyebrow" data-i18n="sec_eyebrow"></div><h2 class="h2" data-i18n="sec_title"></h2></div>
  <div class="feats" id="feats"></div>
  <div class="prog glass" id="prog"></div>
</section>

<!-- THEORY -->
<section class="view" id="v-theory">
  <div class="sec-head"><div class="eyebrow" data-i18n="th_eyebrow"></div><h2 class="h2" data-i18n="th_title"></h2></div>
  <div class="th"><aside class="mods glass" id="mods"></aside><article class="art glass" id="art"></article></div>
</section>

<!-- SIMULATOR -->
<section class="view" id="v-simulator">
  <div class="sec-head"><div class="eyebrow" data-i18n="sim_eyebrow"></div><h2 class="h2" data-i18n="sim_title"></h2><p class="sub" data-i18n="sim_sub"></p></div>
  <div class="sim">
    <aside class="ctrl glass">
      <div><h5 data-i18n="sim_op"></h5><div class="ops" id="ops"></div></div>
      <div><h5><span data-i18n="sim_np"></span><b id="npVal">4</b></h5><input type="range" id="np" min="2" max="8" value="4"></div>
      <div><h5 data-i18n="sim_root"></h5><div class="roots" id="roots"></div></div>
      <div><h5><span data-i18n="sim_speed"></span><b id="spVal">1.0×</b></h5><input type="range" id="speed" min="0.4" max="2.4" step="0.1" value="1"></div>
      <div class="kbd" data-i18n-html="sim_keys"></div>
    </aside>
    <div class="stage glass">
      <div class="fogcard"><svg id="simSvg"></svg></div>
      <div class="bar2"><i id="simBar"></i></div>
      <div class="transport">
        <button class="tb" id="bReset" title="Reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
        <button class="tb" id="bBack"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 6v12l-9-6z"/><rect x="5" y="6" width="2.4" height="12" rx="1"/></svg></button>
        <button class="tb play" id="bPlay"><svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg><svg id="icPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6.5" y="5" width="3.8" height="14" rx="1.2"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.2"/></svg></button>
        <button class="tb" id="bFwd"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6v12l9-6z"/><rect x="16.6" y="6" width="2.4" height="12" rx="1"/></svg></button>
        <div class="stepinfo"><b id="stepTxt"></b><span id="stepSub"></span></div>
      </div>
    </div>
    <div class="side">
      <div class="card glass"><h5 data-i18n="sim_how"></h5><p id="simDesc"></p></div>
      <div class="card glass"><h5 data-i18n="sim_code"></h5><div id="simCode"></div></div>
      <div class="card glass"><h5 data-i18n="sim_log"></h5><ul class="log" id="simLog"></ul></div>
    </div>
  </div>
</section>

<!-- TESTS -->
<section class="view" id="v-tests"><div class="qz" id="quiz"></div></section>

<!-- TASKS -->
<section class="view" id="v-tasks">
  <div class="sec-head"><div class="eyebrow" data-i18n="tk_eyebrow"></div><h2 class="h2" data-i18n="tk_title"></h2><p class="sub" data-i18n="tk_sub"></p></div>
  <div class="chips tfil" id="tfil"></div>
  <div class="tlist" id="tlist"></div>
  <p class="note" data-i18n="tk_note"></p>
</section>

<!-- INSTALL -->
<section class="view" id="v-install">
  <div class="sec-head"><div class="eyebrow" data-i18n="in_eyebrow"></div><h2 class="h2" data-i18n="in_title"></h2></div>
  <div class="inst glass" id="inst"></div>
</section>

</div>
</main>
<footer><span data-i18n="foot"></span><span class="pg" id="pg">01 / 06</span></footer>

<script>
"use strict";
let current='';
/* ---------- utilities ---------- */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem('mpiatlas:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mpiatlas:'+k,JSON.stringify(v))}catch(e){}}};
let LANG=store.get('lang','ru');
const L=x=>Array.isArray(x)?x[LANG==='ru'?0:1]:(x&&typeof x==='object'&&!Array.isArray(x)&&(x.ru||x.kk))?x[LANG]:x;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ICON={
 arr:'<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',

  {p:['В модели с распределённой памятью каждый процесс имеет собственное адресное пространство. Процессы не видят переменные друг друга и обмениваются данными только явно — отправляя и принимая сообщения. MPI описывает набор функций для такого обмена и не привязан к одному языку: есть привязки для C, C++ и Fortran, а через библиотеки — для Python (mpi4py) и других языков.','Таратылған жады моделінде әр процестің өз адрестік кеңістігі болады. Процестер бір-бірінің айнымалыларын көрмейді және деректермен тек айқын түрде — хабарламаларды жіберу және қабылдау арқылы алмасады. MPI осындай алмасуға арналған функциялар жиынын сипаттайды және бір тілге байланбаған: C, C++ және Fortran үшін байланыстар бар, ал кітапханалар арқылы Python (mpi4py) және басқа тілдерге де қолжетімді.']},

MPI_Comm_rank(MPI_COMM_WORLD, &world_rank);

int color = world_rank / 4;      /* row of a 4-column grid */
MPI_Comm_split(MPI_COMM_WORLD, color, world_rank, &row_comm);

MPI_Comm_rank(row_comm, &row_rank);
MPI_Comm_size(row_comm, &row_size);

printf("world %d -> row %d, rank %d of %d\\n",
       world_rank, color, row_rank, row_size);

MPI_Comm_free(&row_comm);`,lang:'c',file:'split.c'},
  {p:['Созданный коммуникатор нужно освободить вызовом MPI_Comm_free, когда он больше не нужен.','Құрылған коммуникаторды қажет болмаған кезде MPI_Comm_free шақыруымен босату керек.']},
  {h:['Ключевое','Негізгі түйін']},
  {pts:[['Ранг процесса имеет смысл только внутри конкретного коммуникатора','Процестің рангі тек нақты коммуникатордың ішінде мағыналы'],['Один процесс может входить в несколько коммуникаторов с разными рангами','Бір процесс әртүрлі рангтермен бірнеше коммуникаторға кіре алады'],['Отдельные коммуникаторы изолируют сообщения библиотек от сообщений программы','Жеке коммуникаторлар кітапхана хабарламаларын бағдарлама хабарламаларынан оқшаулайды']]}
 ]},
{title:['Двухточечные обмены','Нүктеден нүктеге алмасу'],
 lead:['MPI_Send и MPI_Recv связывают ровно два процесса: отправителя и получателя.','MPI_Send және MPI_Recv дәл екі процесті байланыстырады: жіберуші мен алушыны.'],
 blocks:[
  {p:['Сообщение описывается тройкой «буфер, количество, тип данных» и конвертом «отправитель, получатель, тег, коммуникатор». Тег — целое число, по которому получатель может отличать сообщения разного назначения.','Хабарлама «буфер, саны, деректер типі» үштігімен және «жіберуші, алушы, тег, коммуникатор» конвертімен сипатталады. Тег — бүтін сан, ол арқылы алушы әртүрлі мақсаттағы хабарламаларды ажырата алады.']},
  {code:`int MPI_Send(const void *buf, int count, MPI_Datatype type,
             int dest, int tag, MPI_Comm comm);

int MPI_Recv(void *buf, int count, MPI_Datatype type,
             int source, int tag, MPI_Comm comm, MPI_Status *status);`,lang:'c',file:'signatures'},
  {p:['Получатель может принимать сообщения от любого отправителя (MPI_ANY_SOURCE) и с любым тегом (MPI_ANY_TAG). Фактические параметры сообщения записываются в MPI_Status: поля MPI_SOURCE и MPI_TAG, а длину возвращает MPI_Get_count.','Алушы кез келген жіберушіден (MPI_ANY_SOURCE) және кез келген тегпен (MPI_ANY_TAG) хабарлама қабылдай алады. Хабарламаның нақты параметрлері MPI_Status-қа жазылады: MPI_SOURCE және MPI_TAG өрістері, ал ұзындығын MPI_Get_count қайтарады.']},
  {code:`if (rank == 0) {
    double x[3] = {1.5, 2.5, 3.5};
    MPI_Send(x, 3, MPI_DOUBLE, 1, 7, MPI_COMM_WORLD);
} else if (rank == 1) {
    double y[10];
    MPI_Status st;
    int n;
    MPI_Recv(y, 10, MPI_DOUBLE, MPI_ANY_SOURCE, MPI_ANY_TAG,
             MPI_COMM_WORLD, &st);
    MPI_Get_count(&st, MPI_DOUBLE, &n);
    printf("got %d values from %d, tag %d\\n", n, st.MPI_SOURCE, st.MPI_TAG);
}`,lang:'c',file:'p2p.c'},
  {h:['Типы данных','Деректер типтері']},

  {sims:['sendrecv','ring']}
 ]},
{title:['Режимы передачи и взаимоблокировки','Жіберу режимдері және өзара бұғаттау'],
 lead:['Блокирующие операции удобны, но неверный порядок вызовов может навсегда остановить программу.','Бұғаттайтын операциялар ыңғайлы, бірақ шақырулардың қате реті бағдарламаны мүлдем тоқтатып тастауы мүмкін.'],
 blocks:[
  {p:['MPI_Send возвращает управление, когда буфер отправки можно безопасно переиспользовать. Будет ли сообщение буферизовано или отправитель дождётся получателя, решает реализация, поэтому корректная программа не должна полагаться на буферизацию.','MPI_Send жіберу буферін қауіпсіз қайта пайдалануға болған кезде басқаруды қайтарады. Хабарлама буферленеді ме, әлде жіберуші алушыны күте ме — оны іске асыру шешеді, сондықтан дұрыс бағдарлама буферлеуге сүйенбеуі керек.']},
  {table:{head:[['Режим','Режим'],['Когда завершается','Қашан аяқталады']],rows:[
   ['MPI_Send',['Стандартный: буфер можно переиспользовать','Стандартты: буферді қайта пайдалануға болады']],
   ['MPI_Ssend',['Синхронный: получатель начал приём','Синхронды: алушы қабылдауды бастады']],
   ['MPI_Bsend',['Буферизованный: данные скопированы в буфер MPI_Buffer_attach','Буферленген: деректер MPI_Buffer_attach буферіне көшірілді']],
   ['MPI_Rsend',['Режим готовности: допустим, только если приём уже начат','Дайындық режимі: қабылдау басталған жағдайда ғана рұқсат']]]}},
  {p:['Взаимоблокировка (deadlock) возникает, когда процессы бесконечно ждут друг друга. Классический пример — оба процесса сначала вызывают MPI_Recv: каждый ждёт сообщения, которое никто не отправит.','Өзара бұғаттау (deadlock) процестер бір-бірін шексіз күткенде пайда болады. Классикалық мысал — екі процесс те алдымен MPI_Recv шақырады: әрқайсысы ешкім жібермейтін хабарламаны күтеді.']},
  {code:`/* deadlock: both processes block in MPI_Recv */
int other = 1 - rank;
MPI_Recv(&in,  1, MPI_INT, other, 0, MPI_COMM_WORLD, MPI_STATUS_IGNORE);
MPI_Send(&out, 1, MPI_INT, other, 0, MPI_COMM_WORLD);`,lang:'c',file:'deadlock.c'},
  {code:`/* safe exchange */
int other = 1 - rank;
MPI_Sendrecv(&out, 1, MPI_INT, other, 0,
             &in,  1, MPI_INT, other, 0,
             MPI_COMM_WORLD, MPI_STATUS_IGNORE);`,lang:'c',file:'sendrecv.c'},
  {h:['Как избежать','Қалай болдырмау керек']},
  {pts:[['Упорядочить вызовы: чётные ранги сначала отправляют, нечётные — принимают','Шақыруларды реттеу: жұп рангтер алдымен жібереді, тақ рангтер — қабылдайды'],['Использовать MPI_Sendrecv для парных обменов','Жұптық алмасулар үшін MPI_Sendrecv қолдану'],['Перейти на неблокирующие MPI_Isend и MPI_Irecv','Бұғаттамайтын MPI_Isend пен MPI_Irecv-ке көшу'],['Проверять программу с MPI_Ssend: так проявляются скрытые deadlock','Бағдарламаны MPI_Ssend-пен тексеру: жасырын deadlock осылай байқалады']]}
 ]},
{title:['Неблокирующие операции','Бұғаттамайтын операциялар'],
 lead:['Неблокирующие вызовы позволяют считать, пока данные передаются по сети.','Бұғаттамайтын шақырулар деректер желі арқылы берілгенде есептеуге мүмкіндік береді.'],
 blocks:[
  {p:['MPI_Isend и MPI_Irecv только инициируют обмен и сразу возвращают управление вместе с объектом запроса MPI_Request. Пока обмен идёт, процесс может выполнять вычисления — так вычисления и коммуникации перекрываются.','MPI_Isend және MPI_Irecv алмасуды тек бастайды да, MPI_Request сұраныс объектісімен бірге басқаруды бірден қайтарады. Алмасу жүріп жатқанда процесс есептеулерді орындай алады — осылайша есептеулер мен коммуникациялар қабаттасады.']},
  {code:`MPI_Request req[2];
int left  = (rank - 1 + size) % size;
int right = (rank + 1) % size;

MPI_Irecv(&from_left, 1, MPI_INT, left,  0, MPI_COMM_WORLD, &req[0]);
MPI_Isend(&mine,      1, MPI_INT, right, 0, MPI_COMM_WORLD, &req[1]);

compute_interior();          /* useful work while data is in flight */

MPI_Waitall(2, req, MPI_STATUSES_IGNORE);
compute_boundary(from_left);`,lang:'c',file:'overlap.c'},
  {p:['Завершить операцию можно через MPI_Wait или MPI_Waitall, а проверить её состояние без ожидания — через MPI_Test. До завершения нельзя изменять буфер отправки и читать буфер приёма.','Операцияны MPI_Wait немесе MPI_Waitall арқылы аяқтауға, ал оның күйін күтпей MPI_Test арқылы тексеруге болады. Аяқталғанға дейін жіберу буферін өзгертуге және қабылдау буферін оқуға болмайды.']},
  {table:{head:[['Функция','Функция'],['Назначение','Мақсаты']],rows:[
   ['MPI_Isend',['Начать отправку','Жіберуді бастау']],
   ['MPI_Irecv',['Начать приём','Қабылдауды бастау']],
   ['MPI_Wait',['Дождаться завершения одного запроса','Бір сұраныстың аяқталуын күту']],
   ['MPI_Waitall',['Дождаться всех запросов массива','Массивтегі барлық сұраныстарды күту']],
   ['MPI_Test',['Проверить завершение без ожидания','Аяқталуын күтпей тексеру']]]}}
 ]},
{title:['Коллективные операции','Ұжымдық операциялар'],
 lead:['Одна функция — и все процессы коммуникатора участвуют в обмене.','Бір функция — және коммуникатордың барлық процестері алмасуға қатысады.'],
 blocks:[
  {p:['Коллективные операции вызываются всеми процессами коммуникатора. Они выражают типовые схемы обмена одним вызовом, а реализации MPI выполняют их по оптимизированным алгоритмам — например, по двоичному дереву за ⌈log₂p⌉ шагов вместо p − 1.','Ұжымдық операцияларды коммуникатордың барлық процестері шақырады. Олар типтік алмасу схемаларын бір шақырумен өрнектейді, ал MPI іске асырулары оларды оңтайландырылған алгоритмдермен орындайды — мысалы, p − 1 қадамның орнына екілік ағаш бойынша ⌈log₂p⌉ қадаммен.']},
  {table:{head:[['Операция','Операция'],['Что делает','Не істейді']],rows:[
   ['MPI_Barrier',['Синхронизирует все процессы','Барлық процестерді синхрондайды']],
   ['MPI_Bcast',['Копирует данные корня во все процессы','Түбір деректерін барлық процестерге көшіреді']],
   ['MPI_Scatter',['Раздаёт части массива корня по процессам','Түбір массивінің бөліктерін процестерге таратады']],
   ['MPI_Gather',['Собирает значения всех процессов на корне','Барлық процестердің мәндерін түбірге жинайды']],
   ['MPI_Allgather',['Собирает значения во всех процессах','Мәндерді барлық процестерде жинайды']],
   ['MPI_Reduce',['Редукция с результатом на корне','Нәтижесі түбірде болатын редукция']],
   ['MPI_Allreduce',['Редукция с результатом во всех процессах','Нәтижесі барлық процестерде болатын редукция']],
   ['MPI_Alltoall',['Каждый отправляет каждому свой блок','Әрқайсысы әрқайсысына өз блогын жібереді']]]}},
  {code:`int n = 0;
if (rank == 0) n = 1000;
MPI_Bcast(&n, 1, MPI_INT, 0, MPI_COMM_WORLD);

double local = 0.0, total = 0.0;
for (int i = rank; i < n; i += size)
    local += f(i);

MPI_Reduce(&local, &total, 1, MPI_DOUBLE, MPI_SUM, 0, MPI_COMM_WORLD);`,lang:'c',file:'collective.c'},
  {p:['Предопределённые операции редукции: MPI_SUM, MPI_PROD, MPI_MAX, MPI_MIN, логические MPI_LAND и MPI_LOR, а также MPI_MAXLOC и MPI_MINLOC, которые возвращают значение вместе с рангом его владельца.','Алдын ала анықталған редукция операциялары: MPI_SUM, MPI_PROD, MPI_MAX, MPI_MIN, логикалық MPI_LAND және MPI_LOR, сондай-ақ мәнді оның иесінің рангімен бірге қайтаратын MPI_MAXLOC және MPI_MINLOC.']},
  {p:['Все процессы должны вызывать коллективные операции в одинаковом порядке. Если хотя бы один процесс пропустит вызов, остальные могут зависнуть.','Барлық процестер ұжымдық операцияларды бірдей ретпен шақыруы тиіс. Егер кемінде бір процесс шақыруды өткізіп алса, қалғандары қатып қалуы мүмкін.']},
  {sims:['bcast','scatter','gather','reduce','allreduce','allgather','barrier']}
 ]},
{title:['Производительность и закон Амдала','Өнімділік және Амдал заңы'],
 lead:['Больше процессов — не всегда пропорционально быстрее.','Процестер көбейген сайын әрдайым пропорционалды жылдамдай бермейді.'],
 blocks:[
  {p:['Ускорение S(p) = T₁ / Tₚ показывает, во сколько раз программа на p процессах быстрее последовательной. Эффективность E(p) = S(p) / p показывает, какая доля вычислительных ресурсов используется полезно.','Үдеу S(p) = T₁ / Tₚ бағдарламаның p процесте тізбектіге қарағанда неше есе жылдам екенін көрсетеді. Тиімділік E(p) = S(p) / p есептеу ресурстарының қандай үлесі пайдалы қолданылатынын көрсетеді.']},
  {p:['Закон Амдала: если доля f программы выполняется только последовательно, то S(p) = 1 / (f + (1 − f) / p), и при любом числе процессов ускорение не превышает 1 / f. Попробуйте сами:','Амдал заңы: егер бағдарламаның f үлесі тек тізбекті орындалса, онда S(p) = 1 / (f + (1 − f) / p), және процестер саны қанша болса да үдеу 1 / f-тен аспайды. Өзіңіз байқап көріңіз:']},
  {widget:'amdahl'},
  {p:['Закон Густафсона смотрит иначе: с ростом числа процессов обычно растёт и размер задачи, поэтому масштабируемое ускорение S = p − f(p − 1).','Густафсон заңы басқаша қарайды: процестер саны өскенде әдетте есептің өлшемі де өседі, сондықтан масштабталатын үдеу S = p − f(p − 1).']},
  {code:`MPI_Barrier(MPI_COMM_WORLD);
double t0 = MPI_Wtime();

solve();                         /* measured part */

MPI_Barrier(MPI_COMM_WORLD);
double t1 = MPI_Wtime();
if (rank == 0) printf("time: %.3f s\\n", t1 - t0);`,lang:'c',file:'timing.c'},
  {p:['Барьеры перед замером выравнивают старт процессов, а итоговое время определяется самым медленным из них.','Өлшеу алдындағы барьерлер процестердің басталуын теңестіреді, ал қорытынды уақыт олардың ең баяуымен анықталады.']},
  {h:['Ключевое','Негізгі түйін']},
  {pts:[['Коммуникации — накладные расходы: чем их меньше относительно вычислений, тем лучше','Коммуникациялар — қосымша шығын: олар есептеулерге қатысты неғұрлым аз болса, соғұрлым жақсы'],['Неравномерная нагрузка заставляет быстрые процессы ждать медленные','Біркелкі емес жүктеме жылдам процестерді баяуларын күтуге мәжбүрлейді'],['Последовательная часть ограничивает ускорение сверху','Тізбекті бөлік үдеуді жоғарыдан шектейді']]}
 ]}
];

{m:1,q:['Что возвращает функция <code>MPI_Comm_rank</code>?','<code>MPI_Comm_rank</code> функциясы нені қайтарады?'],o:[['Общее число процессов','Жалпы процестер саны'],['Номер текущего процесса в коммуникаторе','Коммуникатордағы ағымдағы процестің нөмірі'],['Имя вычислительного узла','Есептеу түйінінің атауы'],['Идентификатор коммуникатора','Коммуникатор идентификаторы']],a:1,e:['MPI_Comm_rank записывает ранг — номер процесса от 0 до size − 1. Общее число процессов возвращает MPI_Comm_size.','MPI_Comm_rank рангті — 0-ден size − 1-ге дейінгі процесс нөмірін жазады. Процестердің жалпы санын MPI_Comm_size қайтарады.']},
{m:1,q:['Какую функцию MPI нужно вызвать раньше всех остальных?','MPI-дің қай функциясын басқалардың бәрінен бұрын шақыру керек?'],o:['<code>MPI_Comm_rank</code>','<code>MPI_Init</code>','<code>MPI_Start</code>','<code>MPI_Comm_size</code>'],a:1,e:['MPI_Init инициализирует среду выполнения; до него допустимы лишь немногие функции вроде MPI_Initialized.','MPI_Init орындау ортасын инициализациялайды; оған дейін MPI_Initialized сияқты санаулы функцияларға ғана рұқсат етіледі.']},
{m:0,q:['Что означает модель SPMD?','SPMD моделі нені білдіреді?'],o:[['Одна программа запускается в нескольких экземплярах и обрабатывает разные данные','Бір бағдарлама бірнеше данада іске қосылып, әртүрлі деректерді өңдейді'],['Каждый процесс выполняет свою отдельную программу','Әр процесс өзінің жеке бағдарламасын орындайды'],['Все процессы работают с общей памятью','Барлық процестер ортақ жадымен жұмыс істейді'],['Программа выполняется только на графическом процессоре','Бағдарлама тек графикалық процессорда орындалады']],a:0,e:['Single Program, Multiple Data: код один, а ветвление по рангу определяет, что делает каждый процесс.','Single Program, Multiple Data: код біреу, ал рангке қарай тармақталу әр процестің не істейтінін анықтайды.']},
{m:1,q:['Какие значения принимает ранг в коммуникаторе из p процессов?','p процестен тұратын коммуникаторда ранг қандай мәндер қабылдайды?'],o:['0 … p − 1','1 … p','0 … p','−1 … p − 1'],a:0,e:['Ранги нумеруются с нуля, поэтому последний процесс имеет ранг p − 1.','Рангтер нөлден бастап нөмірленеді, сондықтан соңғы процестің рангі p − 1.']},
{m:2,q:['Какой коммуникатор содержит все запущенные процессы?','Қай коммуникатор барлық іске қосылған процестерді қамтиды?'],o:['<code>MPI_COMM_WORLD</code>','<code>MPI_COMM_SELF</code>','<code>MPI_COMM_ALL</code>','<code>MPI_GROUP_WORLD</code>'],a:0,e:['MPI_COMM_SELF содержит только сам процесс, а MPI_COMM_ALL и MPI_GROUP_WORLD в стандарте нет.','MPI_COMM_SELF тек процестің өзін қамтиды, ал MPI_COMM_ALL мен MPI_GROUP_WORLD стандартта жоқ.']},
{m:2,q:['Какой аргумент <code>MPI_Comm_split</code> определяет, в какой новый коммуникатор попадёт процесс?','<code>MPI_Comm_split</code>-тің қай аргументі процестің қай жаңа коммуникаторға түсетінін анықтайды?'],o:['<code>color</code>','<code>key</code>','<code>tag</code>','<code>root</code>'],a:0,e:['Процессы с одинаковым color объединяются; key лишь задаёт порядок рангов внутри новой группы.','color мәні бірдей процестер біріктіріледі; key тек жаңа топтағы рангтер ретін береді.']},
{m:3,q:['Какая константа позволяет принять сообщение от любого отправителя?','Қай тұрақты кез келген жіберушіден хабарлама қабылдауға мүмкіндік береді?'],o:['<code>MPI_ANY_SOURCE</code>','<code>MPI_ANY_TAG</code>','<code>MPI_SOURCE_ALL</code>','<code>MPI_PROC_NULL</code>'],a:0,e:['MPI_ANY_TAG — для любого тега, а MPI_PROC_NULL — «пустой» процесс, обмен с которым ничего не делает.','MPI_ANY_TAG — кез келген тег үшін, ал MPI_PROC_NULL — «бос» процесс, онымен алмасу ештеңе істемейді.']},
{m:3,q:['Как узнать, сколько элементов фактически пришло в <code>MPI_Recv</code>?','<code>MPI_Recv</code>-ке нақты қанша элемент келгенін қалай білуге болады?'],o:[['Вызвать MPI_Get_count для полученного статуса','Алынған статус үшін MPI_Get_count шақыру'],['Прочитать аргумент count у MPI_Recv','MPI_Recv-тің count аргументін оқу'],['Вызвать MPI_Comm_size','MPI_Comm_size шақыру'],['Это невозможно','Бұл мүмкін емес']],a:0,e:['count в MPI_Recv — лишь максимальный размер буфера. Реальную длину сообщения возвращает MPI_Get_count.','MPI_Recv-тегі count — тек буфердің ең үлкен өлшемі. Хабарламаның нақты ұзындығын MPI_Get_count қайтарады.']},
{m:3,q:['Процесс A дважды отправляет сообщения процессу B в одном коммуникаторе с одним тегом. В каком порядке B их получит?','A процесі B процесіне бір коммуникаторда бір тегпен екі рет хабарлама жібереді. B оларды қандай ретпен алады?'],o:[['В порядке отправки','Жіберу ретімен'],['В случайном порядке','Кездейсоқ ретпен'],['Сначала более короткое','Алдымен қысқасын'],['Зависит от числа процессов','Процестер санына байланысты']],a:0,e:['MPI гарантирует, что сообщения между одной парой процессов не обгоняют друг друга, если подходят под одни и те же параметры приёма.','MPI бір жұп процесс арасындағы хабарламалар бірдей қабылдау параметрлеріне сәйкес келсе, бірін-бірі басып озбайтынына кепілдік береді.']},
{m:4,q:['Два процесса сначала вызывают <code>MPI_Recv</code> друг от друга, а затем <code>MPI_Send</code>. Что произойдёт?','Екі процесс алдымен бір-бірінен <code>MPI_Recv</code>, содан кейін <code>MPI_Send</code> шақырады. Не болады?'],o:[['Взаимоблокировка: оба процесса будут ждать вечно','Өзара бұғаттау: екі процесс те мәңгі күтеді'],['Программа отработает корректно','Бағдарлама дұрыс орындалады'],['Ошибка компиляции','Компиляция қатесі'],['Результат зависит от размера сообщения','Нәтиже хабарлама өлшеміне байланысты']],a:0,e:['Блокирующий MPI_Recv не вернётся, пока не придёт сообщение, а отправить его некому — оба процесса ждут.','Бұғаттайтын MPI_Recv хабарлама келмейінше қайтпайды, ал оны жіберетін ешкім жоқ — екі процесс те күтеді.']},
{m:4,q:['Какая функция совмещает отправку и приём и помогает избежать взаимоблокировки?','Қай функция жіберу мен қабылдауды біріктіріп, өзара бұғаттауды болдырмауға көмектеседі?'],o:['<code>MPI_Sendrecv</code>','<code>MPI_Bsend</code>','<code>MPI_Ssend</code>','<code>MPI_Bcast</code>'],a:0,e:['MPI_Sendrecv выполняет обе операции, а реализация сама избегает циклического ожидания.','MPI_Sendrecv екі операцияны да орындайды, ал іске асыру циклдік күтуді өзі болдырмайды.']},
{m:4,q:['Чем <code>MPI_Ssend</code> отличается от <code>MPI_Send</code>?','<code>MPI_Ssend</code>-тің <code>MPI_Send</code>-тен айырмашылығы неде?'],o:[['Завершается только после того, как получатель начал приём','Алушы қабылдауды бастағаннан кейін ғана аяқталады'],['Никогда не блокируется','Ешқашан бұғатталмайды'],['Отправляет сообщение всем процессам','Хабарламаны барлық процестерге жібереді'],['Работает только с MPI_INT','Тек MPI_INT-пен жұмыс істейді']],a:0,e:['Синхронный режим гарантирует, что приём начат. Программа, корректная с MPI_Ssend, не зависит от буферизации.','Синхронды режим қабылдаудың басталғанына кепілдік береді. MPI_Ssend-пен дұрыс жұмыс істейтін бағдарлама буферлеуге тәуелді емес.']},
{m:5,q:['Когда можно изменять буфер, переданный в <code>MPI_Isend</code>?','<code>MPI_Isend</code>-ке берілген буферді қашан өзгертуге болады?'],o:[['После завершения через MPI_Wait или успешный MPI_Test','MPI_Wait немесе сәтті MPI_Test арқылы аяқталғаннан кейін'],['Сразу после возврата из MPI_Isend','MPI_Isend-тен қайтқаннан кейін бірден'],['После вызова MPI_Barrier','MPI_Barrier шақырылғаннан кейін'],['Никогда','Ешқашан']],a:0,e:['MPI_Isend лишь начинает передачу. Пока запрос не завершён, данные могут ещё читаться из буфера.','MPI_Isend тек жіберуді бастайды. Сұраныс аяқталмайынша, деректер буферден әлі оқылуы мүмкін.']},
{m:5,q:['Зачем нужны неблокирующие операции?','Бұғаттамайтын операциялар не үшін қажет?'],o:[['Чтобы совмещать вычисления с передачей данных','Есептеулерді деректер жіберумен қабаттастыру үшін'],['Чтобы не вызывать MPI_Init','MPI_Init шақырмау үшін'],['Чтобы передавать данные без коммуникатора','Деректерді коммуникаторсыз жіберу үшін'],['Чтобы гарантировать порядок вывода','Шығыс ретіне кепілдік беру үшін']],a:0,e:['Пока сообщения в пути, процесс считает свою часть задачи, а затем ждёт завершения через MPI_Wait.','Хабарламалар жолда болғанда процесс өз бөлігін есептейді, содан кейін MPI_Wait арқылы аяқталуын күтеді.']},
{m:6,q:['Что делает <code>MPI_Bcast</code>?','<code>MPI_Bcast</code> не істейді?'],o:[['Делит массив корня на части','Түбір массивін бөліктерге бөледі'],['Собирает данные всех процессов на корне','Барлық процестердің деректерін түбірге жинайды'],['Рассылает одни и те же данные от корня всем процессам','Түбірден барлық процестерге бірдей деректерді таратады'],['Вычисляет сумму значений','Мәндердің қосындысын есептейді']],a:2,e:['Bcast копирует буфер корня во все процессы. Делит данные Scatter, собирает Gather, суммирует Reduce.','Bcast түбір буферін барлық процестерге көшіреді. Деректерді Scatter бөледі, Gather жинайды, Reduce қосады.']},
{m:6,q:['Чем <code>MPI_Allreduce</code> отличается от <code>MPI_Reduce</code>?','<code>MPI_Allreduce</code>-тің <code>MPI_Reduce</code>-тен айырмашылығы неде?'],o:[['Результат получают все процессы','Нәтижені барлық процестер алады'],['Не требует операции редукции','Редукция операциясын қажет етпейді'],['Работает только для двух процессов','Тек екі процесс үшін жұмыс істейді'],['Вызывается только корнем','Тек түбір шақырады']],a:0,e:['Allreduce эквивалентен Reduce с последующим Bcast, поэтому у него нет аргумента root.','Allreduce Reduce-тен кейінгі Bcast-қа эквивалентті, сондықтан онда root аргументі жоқ.']},
{m:6,q:['Сколько шагов нужно рассылке по двоичному дереву на 8 процессах?','8 процесте екілік ағаш бойынша таратуға неше қадам керек?'],o:['1','3','7','8'],a:1,e:['На каждом шаге число процессов с данными удваивается: 1 → 2 → 4 → 8, то есть log₂8 = 3 шага. Это видно в симуляторе.','Әр қадамда деректері бар процестер саны екі есе артады: 1 → 2 → 4 → 8, яғни log₂8 = 3 қадам. Мұны симуляторда көруге болады.']},
{m:6,q:['Что произойдёт, если один процесс не вызовет коллективную операцию, которую вызвали остальные?','Бір процесс басқалар шақырған ұжымдық операцияны шақырмаса, не болады?'],o:[['Остальные процессы могут зависнуть','Қалған процестер қатып қалуы мүмкін'],['MPI пропустит этот процесс','MPI бұл процесті өткізіп жібереді'],['Операция выполнится без его данных','Операция оның деректерінсіз орындалады'],['Ничего, это допустимо','Ештеңе, бұл рұқсат етілген']],a:0,e:['Коллективные операции должны вызываться всеми процессами коммуникатора в одном порядке — иначе программа некорректна.','Ұжымдық операцияларды коммуникатордың барлық процестері бірдей ретпен шақыруы тиіс — әйтпесе бағдарлама дұрыс емес.']},
{m:7,q:['Последовательная часть программы — 10 %. Каков предел ускорения по закону Амдала?','Бағдарламаның тізбекті бөлігі — 10 %. Амдал заңы бойынша үдеудің шегі қандай?'],o:['10','90','100',['Не ограничено','Шектелмеген']],a:0,e:['Предел равен 1 / f = 1 / 0,1 = 10, сколько бы процессов ни было.','Шек 1 / f = 1 / 0,1 = 10-ға тең, процестер саны қанша болса да.']},
{m:7,q:['На 8 процессах получено ускорение 6. Какова эффективность?','8 процесте 6 есе үдеу алынды. Тиімділік қандай?'],o:['0,75','1,33','48','0,6'],a:0,e:['E = S / p = 6 / 8 = 0,75, то есть 75 % ресурсов используется полезно.','E = S / p = 6 / 8 = 0,75, яғни ресурстардың 75 %-ы пайдалы қолданылады.']}
];

/* ---------- tasks ---------- */
const GROUPS=[['Ранги процессов','Процестер рангтері'],['Передача сообщений','Хабарламалар жіберу'],['Коллективные операции','Ұжымдық операциялар'],['Комбинированные','Аралас тапсырмалар']];
const TASKS=[
{g:0,l:1,t:['Привет от каждого процесса','Әр процестен сәлем'],d:['Каждый процесс выводит свой ранг и общее число процессов. Процесс с рангом 0 дополнительно выводит строку «master».','Әр процесс өз рангін және процестердің жалпы санын шығарады. Рангі 0 процесс қосымша «master» жолын шығарады.'],h:['Используйте MPI_Comm_rank и MPI_Comm_size, затем условие if (rank == 0).','MPI_Comm_rank пен MPI_Comm_size қолданып, содан кейін if (rank == 0) шартын жазыңыз.'],c:`int rank, size;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);
MPI_Comm_size(MPI_COMM_WORLD, &size);

printf("rank %d of %d\\n", rank, size);
if (rank == 0) printf("master\\n");

MPI_Finalize();`},
{g:0,l:1,t:['Чётные и нечётные','Жұп және тақ'],d:['Процессы с чётным рангом выводят квадрат своего ранга, с нечётным — куб.','Рангі жұп процестер өз рангінің квадратын, ал тақ процестер кубын шығарады.'],h:['Проверьте остаток rank % 2.','rank % 2 қалдығын тексеріңіз.'],c:`int rank;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);

if (rank % 2 == 0)
    printf("rank %d: %d\\n", rank, rank * rank);
else
    printf("rank %d: %d\\n", rank, rank * rank * rank);

MPI_Finalize();`},
{g:0,l:2,t:['Замер времени','Уақытты өлшеу'],d:['Каждый процесс суммирует числа от 1 до 10⁷ · (rank + 1) и выводит время работы цикла, измеренное через MPI_Wtime.','Әр процесс 1-ден 10⁷ · (rank + 1)-ге дейінгі сандарды қосып, MPI_Wtime арқылы өлшенген цикл уақытын шығарады.'],h:['Сохраните MPI_Wtime() до и после цикла и выведите разность.','Циклге дейін және кейін MPI_Wtime() мәнін сақтап, айырмасын шығарыңыз.'],c:`int rank;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);

long long n = 10000000LL * (rank + 1), sum = 0;
double t0 = MPI_Wtime();
for (long long i = 1; i <= n; i++) sum += i;
double t1 = MPI_Wtime();

printf("rank %d: sum = %lld, time = %.4f s\\n", rank, sum, t1 - t0);
MPI_Finalize();`},
{g:1,l:1,t:['Передача массива','Массивті жіберу'],d:['Процесс 0 отправляет процессу 1 массив из пяти целых чисел. Процесс 1 принимает его и выводит.','0-процесс 1-процеске бес бүтін саннан тұратын массив жібереді. 1-процесс оны қабылдап, шығарады.'],h:['Отправка: MPI_Send(a, 5, MPI_INT, 1, 0, …). Приём: MPI_Recv с источником 0.','Жіберу: MPI_Send(a, 5, MPI_INT, 1, 0, …). Қабылдау: көзі 0 болатын MPI_Recv.'],c:`int rank, a[5];
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);

if (rank == 0) {
    for (int i = 0; i < 5; i++) a[i] = (i + 1) * 10;
    MPI_Send(a, 5, MPI_INT, 1, 0, MPI_COMM_WORLD);
} else if (rank == 1) {
    MPI_Recv(a, 5, MPI_INT, 0, 0, MPI_COMM_WORLD, MPI_STATUS_IGNORE);
    for (int i = 0; i < 5; i++) printf("%d ", a[i]);
    printf("\\n");
}
MPI_Finalize();`},
{g:1,l:2,t:['Эстафета по кольцу','Сақина бойымен эстафета'],d:['Процесс 0 создаёт токен со значением 0 и отправляет его процессу 1. Каждый следующий процесс прибавляет к токену свой ранг и передаёт дальше, последний — снова процессу 0. Процесс 0 выводит результат и проверяет, что он равен p(p − 1)/2.','0-процесс мәні 0 болатын токен жасап, оны 1-процеске жібереді. Әрбір келесі процесс токенге өз рангін қосып, әрі қарай береді, соңғысы — қайтадан 0-процеске. 0-процесс нәтижені шығарып, оның p(p − 1)/2-ге тең екенін тексереді.'],h:['Сосед справа: (rank + 1) % size, слева: (rank − 1 + size) % size. Процесс 0 сначала отправляет, остальные сначала принимают.','Оң жақтағы көрші: (rank + 1) % size, сол жақтағы: (rank − 1 + size) % size. 0-процесс алдымен жібереді, қалғандары алдымен қабылдайды.'],c:`int rank, size, token;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);
MPI_Comm_size(MPI_COMM_WORLD, &size);

int next = (rank + 1) % size;
int prev = (rank - 1 + size) % size;

if (rank == 0) {
    token = 0;
    MPI_Send(&token, 1, MPI_INT, next, 0, MPI_COMM_WORLD);
    MPI_Recv(&token, 1, MPI_INT, prev, 0, MPI_COMM_WORLD, MPI_STATUS_IGNORE);
    printf("token = %d, expected %d\\n", token, size * (size - 1) / 2);
} else {
    MPI_Recv(&token, 1, MPI_INT, prev, 0, MPI_COMM_WORLD, MPI_STATUS_IGNORE);
    token += rank;
    MPI_Send(&token, 1, MPI_INT, next, 0, MPI_COMM_WORLD);
}
MPI_Finalize();`,sim:'ring'},
{g:1,l:2,t:['Приём от любого отправителя','Кез келген жіберушіден қабылдау'],d:['Все процессы с рангом больше 0 отправляют процессу 0 число rank · 10. Процесс 0 принимает сообщения с MPI_ANY_SOURCE и выводит, от кого и что пришло, в порядке поступления.','Рангі 0-ден үлкен барлық процестер 0-процеске rank · 10 санын жібереді. 0-процесс хабарламаларды MPI_ANY_SOURCE арқылы қабылдап, кімнен не келгенін келу ретімен шығарады.'],h:['Отправителя можно узнать из status.MPI_SOURCE.','Жіберушіні status.MPI_SOURCE арқылы білуге болады.'],c:`int rank, size;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);
MPI_Comm_size(MPI_COMM_WORLD, &size);

if (rank == 0) {
    for (int i = 1; i < size; i++) {
        int x;
        MPI_Status st;
        MPI_Recv(&x, 1, MPI_INT, MPI_ANY_SOURCE, 0, MPI_COMM_WORLD, &st);
        printf("from %d: %d\\n", st.MPI_SOURCE, x);
    }
} else {
    int x = rank * 10;
    MPI_Send(&x, 1, MPI_INT, 0, 0, MPI_COMM_WORLD);
}
MPI_Finalize();`},
{g:1,l:3,t:['Сдвиг по кольцу без deadlock','Deadlock-сыз сақиналық ығысу'],d:['Каждый процесс одновременно отправляет своё значение правому соседу и получает значение от левого. Решите задачу через MPI_Sendrecv так, чтобы программа работала при любом числе процессов.','Әр процесс өз мәнін оң жақтағы көршісіне жіберіп, сол жақтағы көршісінен мән алады. Бағдарлама кез келген процестер санында жұмыс істейтіндей етіп, есепті MPI_Sendrecv арқылы шешіңіз.'],h:['Один вызов MPI_Sendrecv(&mine, …, right, …, &got, …, left, …) заменяет пару Send и Recv.','Бір MPI_Sendrecv(&mine, …, right, …, &got, …, left, …) шақыруы Send пен Recv жұбын алмастырады.'],c:`int rank, size;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);
MPI_Comm_size(MPI_COMM_WORLD, &size);

int right = (rank + 1) % size;
int left  = (rank - 1 + size) % size;
int mine = rank * rank, got;

MPI_Sendrecv(&mine, 1, MPI_INT, right, 0,
             &got,  1, MPI_INT, left,  0,
             MPI_COMM_WORLD, MPI_STATUS_IGNORE);

printf("rank %d got %d from %d\\n", rank, got, left);
MPI_Finalize();`},
{g:2,l:1,t:['Рассылка параметра','Параметрді тарату'],d:['Процесс 0 задаёт число n = 100. Передайте его всем процессам через MPI_Bcast; каждый процесс выводит полученное значение.','0-процесс n = 100 санын береді. Оны MPI_Bcast арқылы барлық процестерге жіберіңіз; әр процесс алған мәнін шығарады.'],h:['MPI_Bcast вызывают все процессы, а не только корень.','MPI_Bcast-ты тек түбір емес, барлық процестер шақырады.'],c:`int rank, n = 0;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);

if (rank == 0) n = 100;
MPI_Bcast(&n, 1, MPI_INT, 0, MPI_COMM_WORLD);

MPI_Finalize();`,sim:'bcast'},
{g:2,l:2,t:['Сумма массива','Массив қосындысы'],d:['Процесс 0 создаёт массив из 4 · p чисел (1, 2, 3, …). Раздайте его поровну через MPI_Scatter, посчитайте локальные суммы и соберите общую сумму на процессе 0 через MPI_Reduce.','0-процесс 4 · p саннан (1, 2, 3, …) тұратын массив жасайды. Оны MPI_Scatter арқылы тең бөліп таратыңыз, жергілікті қосындыларды есептеп, жалпы қосындыны MPI_Reduce арқылы 0-процеске жинаңыз.'],h:['Каждый процесс получает 4 элемента. Проверка: сумма 1..N равна N(N + 1)/2.','Әр процесс 4 элемент алады. Тексеру: 1..N қосындысы N(N + 1)/2-ге тең.'],c:`int rank, size;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);
MPI_Comm_size(MPI_COMM_WORLD, &size);

const int K = 4;
int *data = NULL, part[4];
if (rank == 0) {
    data = malloc(K * size * sizeof(int));
    for (int i = 0; i < K * size; i++) data[i] = i + 1;
}

MPI_Scatter(data, K, MPI_INT, part, K, MPI_INT, 0, MPI_COMM_WORLD);

int local = 0, total = 0;
for (int i = 0; i < K; i++) local += part[i];
MPI_Reduce(&local, &total, 1, MPI_INT, MPI_SUM, 0, MPI_COMM_WORLD);

if (rank == 0) {
    printf("sum = %d\\n", total);
    free(data);
}
MPI_Finalize();`,sim:'reduce'},
{g:2,l:3,t:['Максимум и его владелец','Максимум және оның иесі'],d:['Каждый процесс вычисляет число (rank · 37 + 11) % 50. Найдите глобальный максимум и ранг процесса, у которого он находится, одним вызовом MPI_Reduce с операцией MPI_MAXLOC.','Әр процесс (rank · 37 + 11) % 50 санын есептейді. Жаһандық максимумды және ол орналасқан процестің рангін MPI_MAXLOC операциясымен бір MPI_Reduce шақыруы арқылы табыңыз.'],h:['Используйте структуру { int value; int rank; } и тип MPI_2INT.','{ int value; int rank; } құрылымын және MPI_2INT типін қолданыңыз.'],c:`int rank;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);

struct { int value; int rank; } in, out;
in.value = (rank * 37 + 11) % 50;
in.rank  = rank;

MPI_Reduce(&in, &out, 1, MPI_2INT, MPI_MAXLOC, 0, MPI_COMM_WORLD);

if (rank == 0)
    printf("max = %d on rank %d\\n", out.value, out.rank);
MPI_Finalize();`},
{g:3,l:2,t:['Вычисление числа π','π санын есептеу'],d:['Вычислите π как интеграл функции 4 / (1 + x²) на отрезке [0, 1] методом средних прямоугольников. Процесс 0 рассылает число разбиений n, каждый процесс считает свои прямоугольники с шагом size, результаты суммируются на процессе 0.','π санын [0, 1] кесіндісіндегі 4 / (1 + x²) функциясының интегралы ретінде орта тіктөртбұрыштар әдісімен есептеңіз. 0-процесс бөліктер санын n таратады, әр процесс size қадамымен өз тіктөртбұрыштарын есептейді, нәтижелер 0-процесте қосылады.'],h:['Процесс rank обрабатывает индексы i = rank, rank + size, rank + 2 · size, …','rank процесі i = rank, rank + size, rank + 2 · size, … индекстерін өңдейді.'],c:`int rank, size, n = 0;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);
MPI_Comm_size(MPI_COMM_WORLD, &size);

if (rank == 0) n = 1000000;
MPI_Bcast(&n, 1, MPI_INT, 0, MPI_COMM_WORLD);

double h = 1.0 / n, local = 0.0, pi = 0.0;
for (int i = rank; i < n; i += size) {
    double x = h * (i + 0.5);
    local += 4.0 / (1.0 + x * x);
}
local *= h;

MPI_Reduce(&local, &pi, 1, MPI_DOUBLE, MPI_SUM, 0, MPI_COMM_WORLD);
if (rank == 0) printf("pi = %.12f\\n", pi);
MPI_Finalize();`},
{g:3,l:3,t:['Скалярное произведение','Скалярлық көбейтінді'],d:['Векторы a и b длины N = 8 · p создаются на процессе 0. Раздайте их через MPI_Scatter, вычислите частичные произведения и получите итог на всех процессах через MPI_Allreduce.','Ұзындығы N = 8 · p болатын a және b векторлары 0-процесте жасалады. Оларды MPI_Scatter арқылы таратып, ішінара көбейтінділерді есептеңіз және нәтижені MPI_Allreduce арқылы барлық процестерде алыңыз.'],h:['Нужны два вызова MPI_Scatter — для a и для b.','Екі MPI_Scatter шақыруы қажет — a үшін және b үшін.'],c:`int rank, size;
MPI_Init(&argc, &argv);
MPI_Comm_rank(MPI_COMM_WORLD, &rank);
MPI_Comm_size(MPI_COMM_WORLD, &size);

const int K = 8;
int N = K * size;
double *a = NULL, *b = NULL, pa[8], pb[8];
if (rank == 0) {
    a = malloc(N * sizeof(double));
    b = malloc(N * sizeof(double));
    for (int i = 0; i < N; i++) { a[i] = i; b[i] = 1.0; }
}

MPI_Scatter(a, K, MPI_DOUBLE, pa, K, MPI_DOUBLE, 0, MPI_COMM_WORLD);
MPI_Scatter(b, K, MPI_DOUBLE, pb, K, MPI_DOUBLE, 0, MPI_COMM_WORLD);

double local = 0.0, dot;
for (int i = 0; i < K; i++) local += pa[i] * pb[i];
MPI_Allreduce(&local, &dot, 1, MPI_DOUBLE, MPI_SUM, MPI_COMM_WORLD);

printf("rank %d: dot = %.1f\\n", rank, dot);
if (rank == 0) { free(a); free(b); }
MPI_Finalize();`,sim:'allreduce'}
];

/* ---------- syntax highlight ---------- */
const KW=new Set('int char double float long void return if else for while const struct sizeof unsigned static NULL from import def in as print True False None'.split(' '));
const CMD=new Set('sudo apt brew pip mpicc mpirun mpiexec python'.split(' '));
function hl(code,lang){
  if(lang==='out') return esc(code);
  const rules=lang==='c'?[['com',/\/\/[^\n]*|\/\*[\s\S]*?\*\//],['str',/"(?:\\.|[^"\\\n])*"/],['pp',/#\s*include[^\n]*/],['num',/\b\d+(?:\.\d+)?(?:LL)?\b/],['id',/[A-Za-z_]\w*/]]
    :[['com',/#[^\n]*/],['str',/"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/],['num',/\b\d+(?:\.\d+)?\b/],['id',/[A-Za-z_]\w*/]];
  const re=new RegExp(rules.map(r=>'('+r[1].source+')').join('|'),'g');
  let out='',last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    let j=1;while(m[j]===undefined)j++;
    let cls=rules[j-1][0],tok=m[0];
    if(cls==='id'){cls=/^MPI(_|$)/.test(tok)?'fn':KW.has(tok)?'kw':(lang==='sh'&&CMD.has(tok))?'fn':''}
    out+=cls?`<span class="tk-${cls}">${esc(tok)}</span>`:esc(tok);
    last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}
function codeBlock(code,lang,file){
  return `<div class="code"><div class="bar"><span>${esc(file||lang)}</span><button class="cp" data-copy>${ICON.copy}<span>${T('copy')}</span></button></div><pre>${hl(code,lang)}</pre></div>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-copy]');if(!b)return;
  const txt=b.closest('.code').querySelector('pre').textContent;
  let ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true}catch(err){
    try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e2){}
  }
  const s=b.querySelector('span');s.textContent=ok?T('copied'):'—';setTimeout(()=>{s.textContent=T('copy')},1600);
});
